<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><style>
.bg{fill:#fafbfd}.t{font:700 38px Arial,sans-serif;fill:#102a56}.s{font:400 16px Arial,sans-serif;fill:#61728c}.h{font:700 17px Arial,sans-serif;fill:#102a56}.b{font:400 14px Arial,sans-serif;fill:#3f5879}.k{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#2f659f}.box{stroke:#337bc2;stroke-width:2;rx:10}.cur{fill:#eef6ff}.alp{fill:#f1f8f5;stroke:#278a78}.tar{fill:#fffaf0;stroke:#d18a2b;stroke-dasharray:8 6}.leg{fill:#f1f3f6;stroke:#7b8797;stroke-dasharray:8 6}.ln{fill:none;stroke:#2f7bc4;stroke-width:3;marker-end:url(#a)}.or{fill:none;stroke:#d27a21;stroke-width:3;marker-end:url(#o)}.small{font:400 12px Arial,sans-serif;fill:#61728c}.badge{font:700 10px Arial,sans-serif;letter-spacing:1px}.white{fill:#fff}.foot{font:400 13px Arial,sans-serif;fill:#52647e}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f7bc4"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d27a21"/></marker></defs>
<rect width="1920" height="1080" class="bg"/>
<text x="55" y="62" class="t">KAVEON | Unified data intelligence architecture</text><text x="55" y="91" class="s">Current product path, distributed Engine foundations, and explicitly marked targets</text>
<g transform="translate(1450 48)"><rect width="16" height="16" rx="4" class="cur"/><text x="24" y="13" class="small">Current</text><rect x="85" width="16" height="16" rx="4" class="alp"/><text x="109" y="13" class="small">Alpha</text><rect x="170" width="16" height="16" rx="4" class="tar"/><text x="194" y="13" class="small">Target</text><rect x="255" width="16" height="16" rx="4" class="leg"/><text x="279" y="13" class="small">Legacy</text></g>
<text x="55" y="133" class="k">DATA SOURCES</text><text x="850" y="133" class="k">KAVEON PLATFORM</text><text x="1510" y="133" class="k">PRODUCT SURFACES</text>
<rect x="55" y="151" width="330" height="100" class="box cur"/><text x="80" y="183" class="h">Customer lake</text><text x="80" y="208" class="b">Local and ADLS Gen2 Parquet / Delta</text><text x="80" y="230" class="b">Snapshot-aware reads</text>
<rect x="55" y="270" width="330" height="100" class="box cur"/><text x="80" y="302" class="h">API-managed sources</text><text x="80" y="327" class="b">Cataloged connection metadata</text><text x="80" y="349" class="b">Passthrough SQL through FastAPI</text>
