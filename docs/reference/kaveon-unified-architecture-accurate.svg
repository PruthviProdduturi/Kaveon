<rect x="55" y="508" width="330" height="100" class="box cur"/><text x="80" y="540" class="h">Curated file inputs</text><text x="80" y="565" class="b">Open-source data as registered files</text><text x="80" y="587" class="b">Human-run curation scripts</text>
<rect x="500" y="151" width="900" height="457" class="box cur"/><text x="790" y="190" class="t" style="font-size:30px">KAVEON PLATFORM</text><text x="800" y="216" class="s">Studio · deterministic DLM · distributed Engine foundations</text>
<rect x="535" y="245" width="250" height="130" class="box cur"/><text x="560" y="280" class="h">Kaveon Studio</text><text x="560" y="307" class="b">Chat · Catalog · SQL Lab</text><text x="560" y="330" class="b">Charts · dashboards</text><text x="560" y="353" class="b">Data management surfaces</text>
