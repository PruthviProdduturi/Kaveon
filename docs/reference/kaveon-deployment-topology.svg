<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Kaveon deployment topology</title><desc id="desc">A browser reaches Studio and API while a Kaveon coordinator discovers workers that share access to lake storage.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a0a0a"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1l9 4-9 4z" fill="#4A9EE8"/></marker><style>.h{font:700 18px Inter,Segoe UI,sans-serif;fill:#ececec}.s{font:500 12px Inter,Segoe UI,sans-serif;fill:#a0a0a0}.c{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1.7px;fill:#7a8599}.b{fill:#141414;stroke:#334155;stroke-width:1.5}.x{fill:none;stroke:#4A9EE8;stroke-width:3;marker-end:url(#a)}.beat{fill:#10b981;animation:p 4.5s ease-in-out infinite}@keyframes p{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.beat{animation:none}}</style></defs>
  <rect x="4" y="4" width="1192" height="512" rx="26" fill="url(#bg)" stroke="#203049" stroke-width="2"/><text x="55" y="55" class="c">SELF-HOSTED TOPOLOGY · CURRENT DISCOVERY, TARGET DISTRIBUTED EXECUTION</text>
  <rect class="b" x="55" y="90" width="180" height="82" rx="16"/><text x="145" y="123" text-anchor="middle" class="h">Browser</text><text x="145" y="148" text-anchor="middle" class="s">session cookie</text><path class="x" d="M235 131h48"/>
  <rect class="b" x="290" y="90" width="200" height="82" rx="16"/><text x="390" y="123" text-anchor="middle" class="h">Studio</text><text x="390" y="148" text-anchor="middle" class="s">Next.js proxy</text><path class="x" d="M490 131h48"/>
  <rect class="b" x="545" y="90" width="200" height="82" rx="16"/><text x="645" y="123" text-anchor="middle" class="h">API + DLM</text><text x="645" y="148" text-anchor="middle" class="s">control + intelligence</text><path class="x" d="M745 131h48"/>
  <rect class="b" x="800" y="75" width="345" height="112" rx="16" stroke="#4A9EE8"/><text x="972" y="113" text-anchor="middle" class="h">Engine coordinator</text><text x="972" y="140" text-anchor="middle" class="s">statement API · catalog · planning</text><text x="972" y="164" text-anchor="middle" class="c">HTTP 8080</text>
  <path class="x" d="M972 187v62"/>
  <g><rect class="b" x="620" y="260" width="220" height="92" rx="16"/><circle class="beat" cx="650" cy="290" r="7"/><text x="730" y="294" text-anchor="middle" class="h">Worker 1</text><text x="730" y="324" text-anchor="middle" class="s">heartbeat · execution target</text><rect class="b" x="905" y="260" width="220" height="92" rx="16"/><circle class="beat" cx="935" cy="290" r="7"/><text x="1015" y="294" text-anchor="middle" class="h">Worker 2</text><text x="1015" y="324" text-anchor="middle" class="s">heartbeat · execution target</text></g>
  <path class="x" d="M972 352v55H730v32"/><path class="x" d="M972 407h43v32"/>
  <rect class="b" x="510" y="440" width="625" height="58" rx="16" stroke="#71e59b"/><text x="822" y="475" text-anchor="middle" class="h">Shared lake path · local mount → MinIO → ADLS Gen2/S3</text>
  <rect x="55" y="250" width="430" height="155" rx="16" fill="#0e1927" stroke="#2b4058"/><text x="80" y="282" class="c">IMPLEMENTATION TRUTH</text><text x="80" y="316" class="s">✓ coordinator/worker configuration</text><text x="80" y="342" class="s">✓ discovery and heartbeat registry</text><text x="80" y="368" class="s">✓ statement execution on receiving node</text><text x="80" y="394" class="s">○ distributed fragment scheduling is target work</text>
</svg>
