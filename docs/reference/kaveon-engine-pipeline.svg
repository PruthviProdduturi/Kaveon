<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Kaveon Engine query pipeline</title><desc id="desc">SQL moves through parsing, optimization, physical planning, vectorized operators, and direct lake reads.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a0a0a"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1l9 4-9 4z" fill="#4A9EE8"/></marker><style>.h{font:700 18px Inter,Segoe UI,sans-serif;fill:#ececec}.s{font:500 12px Inter,Segoe UI,sans-serif;fill:#a0a0a0}.c{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1.7px;fill:#7a8599}.box{fill:#141414;stroke:#334155;stroke-width:1.5}.hot{stroke:#4A9EE8}.line{fill:none;stroke:#4A9EE8;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#a);animation:f 4.5s linear infinite}@keyframes f{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style></defs>
  <rect x="4" y="4" width="1192" height="492" rx="26" fill="url(#bg)" stroke="#203049" stroke-width="2"/><text x="55" y="55" class="c">BATCH-AT-A-TIME · ARROW RECORD BATCH IS THE EXECUTION UNIT</text>
  <g><rect class="box hot" x="55" y="95" width="170" height="92" rx="16"/><text x="140" y="130" text-anchor="middle" class="h">SQL</text><text x="140" y="155" text-anchor="middle" class="s">parse → logical plan</text></g><path class="line" d="M225 141h42"/>
  <g><rect class="box" x="275" y="95" width="180" height="92" rx="16"/><text x="365" y="130" text-anchor="middle" class="h">Optimizer · target</text><text x="365" y="155" text-anchor="middle" class="s">filter/projection pushdown</text></g><path class="line" d="M455 141h42"/>
  <g><rect class="box" x="505" y="95" width="180" height="92" rx="16"/><text x="595" y="130" text-anchor="middle" class="h">Physical plan</text><text x="595" y="155" text-anchor="middle" class="s">operator pipeline</text></g><path class="line" d="M685 141h42"/>
  <g><rect class="box" x="735" y="80" width="410" height="122" rx="16"/><text x="940" y="116" text-anchor="middle" class="h">Vectorized execution</text><text x="940" y="145" text-anchor="middle" class="s">scan · filter · project · aggregate · limit</text><text x="940" y="174" text-anchor="middle" class="c">BATCHOPERATOR · SORT/TOPN TARGET</text></g>
  <path class="line" d="M940 202v74"/>
  <g><rect class="box hot" x="735" y="285" width="410" height="120" rx="16"/><text x="940" y="322" text-anchor="middle" class="h">kaveon-storage</text><text x="940" y="350" text-anchor="middle" class="s">metadata · projection · statistics · row groups · decoding</text><text x="940" y="378" text-anchor="middle" class="c">BatchSource</text></g>
  <path class="line" d="M727 345H560"/>
  <g><rect class="box" x="55" y="285" width="495" height="120" rx="16"/><text x="302" y="322" text-anchor="middle" class="h">Customer-owned data</text><text x="302" y="350" text-anchor="middle" class="s">Parquet files · Delta snapshots · Iceberg metadata</text><text x="302" y="378" text-anchor="middle" class="s">Local filesystem today · ADLS Gen2 and S3 target</text></g>
  <text x="55" y="455" class="s">Correctness invariant: absent, incompatible, nested, or inexact statistics must retain data—never prune uncertain rows.</text>
</svg>
