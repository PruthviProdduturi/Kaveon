<rect x="55" y="270" width="330" height="100" class="box cur"/><text x="80" y="302" class="h">API-managed sources</text><text x="80" y="327" class="b">Cataloged connection metadata</text><text x="80" y="349" class="b">Passthrough SQL through FastAPI</text>
<rect x="55" y="389" width="330" height="100" class="box cur"/><text x="80" y="421" class="h">Users and Entra identity</text><text x="80" y="446" class="b">Session, roles and ownership</text><text x="80" y="468" class="b">Server-asserted identity</text>
<rect x="55" y="508" width="330" height="100" class="box cur"/><text x="80" y="540" class="h">Curated file inputs</text><text x="80" y="565" class="b">Open-source data as registered files</text><text x="80" y="587" class="b">Human-run curation scripts</text>
