.bg{fill:#fafbfd}.t{font:700 38px Inter,Arial,sans-serif;fill:#102a56}.s{font:400 16px Inter,Arial,sans-serif;fill:#61728c}.h{font:700 17px Inter,Arial,sans-serif;fill:#102a56}.b{font:400 14px Inter,Arial,sans-serif;fill:#3f5879}.k{font:700 13px Inter,Arial,sans-serif;letter-spacing:2px;fill:#2f659f}.box{stroke:#337bc2;stroke-width:2;rx:10}.cur{fill:#eef6ff}.alp{fill:#f1f8f5;stroke:#278a78}.tar{fill:#fffaf0;stroke:#d18a2b;stroke-dasharray:8 6}.leg{fill:#f1f3f6;stroke:#7b8797;stroke-dasharray:8 6}.ln{fill:none;stroke:#2f7bc4;stroke-width:3;marker-end:url(#a)}.or{fill:none;stroke:#d27a21;stroke-width:3;marker-end:url(#o)}.small{font:400 12px Inter,Arial,sans-serif;fill:#61728c}.badge{font:700 10px Inter,Arial,sans-serif;letter-spacing:1px}.white{fill:#fff}.foot{font:400 13px Inter,Arial,sans-serif;fill:#52647e}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f7bc4"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d27a21"/></marker></defs>
<rect width="1920" height="1080" class="bg"/>
<text x="55" y="62" class="t">KAVEON | Future-state unified data intelligence</text><text x="55" y="91" class="s">One KaveonDB authority for product records and customer-owned lake analytics</text>
<text x="55" y="133" class="k">DATA SOURCES</text><text x="850" y="133" class="k">KAVEON PLATFORM</text><text x="1510" y="133" class="k">PRODUCT SURFACES</text>
