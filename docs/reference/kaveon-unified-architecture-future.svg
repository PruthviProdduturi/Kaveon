<rect x="825" y="245" width="250" height="130" class="box cur"/><text x="850" y="280" class="h">FastAPI control plane</text><text x="850" y="307" class="b">Auth · policy · product APIs</text><text x="850" y="330" class="b">Source registration · telemetry</text><text x="850" y="353" class="b">Trusted proxy boundary</text>
<rect x="1115" y="245" width="250" height="130" class="box cur"/><text x="1140" y="280" class="h">Deterministic DLM</text><text x="1140" y="307" class="b">Intent and dataset routing</text><text x="1140" y="330" class="b">Compiled context answers</text><text x="1140" y="353" class="b">Clarification and SQL contracts</text><rect x="535" y="410" width="410" height="155" class="box alp"/><text x="565" y="447" class="h">KaveonDB record layer</text><text x="565" y="476" class="b">Typed product records</text><text x="565" y="500" class="b">Revision CAS · ownership</text><text x="565" y="524" class="b">Checkpointed migration path</text><rect x="975" y="410" width="390" height="155" class="box alp"/><text x="1005" y="447" class="h">Engine coordinator</text><text x="1005" y="476" class="b">Parse · optimize · stage graph</text><text x="1005" y="500" class="b">Admission · fragments · evidence</text><text x="1005" y="524" class="b">Workers execute Arrow batches</text><rect x="1510" y="151" width="355" height="100" class="box cur"/><text x="1535" y="183" class="h">SQL Lab</text><text x="1535" y="208" class="b">Ad-hoc SQL and saved queries</text><text x="1535" y="230" class="b">Bounded results</text>
<rect x="1510" y="270" width="355" height="100" class="box cur"/><text x="1535" y="302" class="h">Charts and dashboards</text><text x="1535" y="327" class="b">Product visualizations</text><text x="1535" y="349" class="b">Shared data experiences</text>
<rect x="1510" y="389" width="355" height="100" class="box cur"/><text x="1535" y="421" class="h">Chat and DLM answers</text><text x="1535" y="446" class="b">Deterministic question path</text><text x="1535" y="468" class="b">Context or SQL response</text>
<rect x="1510" y="508" width="355" height="100" class="box cur"/><text x="1535" y="540" class="h">Query history and telemetry</text><text x="1535" y="565" class="b">Plans · stages · timings · audit</text><text x="1535" y="587" class="b">Per-query evidence</text>
<path d="M385 201H500" class="ln"/><path d="M385 320H500" class="ln"/><path d="M385 439H500" class="ln"/><path d="M385 558H500" class="ln"/><path d="M1400 201H1510" class="ln"/><path d="M1400 320H1510" class="ln"/><path d="M1400 439H1510" class="or"/><path d="M1400 558H1510" class="ln"/>
<text x="55" y="660" class="k">EXECUTION AND DURABILITY</text>
<rect x="55" y="680" width="1810" height="135" class="box alp"/><text x="85" y="714" class="h">Distributed Engine execution</text><text x="85" y="742" class="b">Arrow exchange · joins · aggregates · Sort/TopN · bounded retry</text><text x="85" y="767" class="b">Workers execute analytical SQL; DLM context answers do not run on workers</text><rect x="55" y="840" width="430" height="105" class="box cur"/><text x="80" y="874" class="h">Customer-owned storage</text><text x="80" y="900" class="b">ADLS Gen2 · Parquet · Delta</text><text x="80" y="923" class="b">Object manifests and snapshots</text>
<rect x="520" y="840" width="430" height="105" class="box alp"/><text x="545" y="874" class="h">Durable product state</text><text x="545" y="900" class="b">Typed records and revisions</text><text x="545" y="923" class="b">Ownership and audit evidence</text>
<rect x="985" y="840" width="430" height="105" class="box tar"/><text x="1010" y="874" class="h">Transactional kernel</text><text x="1010" y="900" class="b">General DML · isolation · durable recovery</text><text x="1010" y="923" class="b">Target before PostgreSQL retirement</text><rect x="1450" y="840" width="415" height="105" class="box tar"/><text x="1475" y="874" class="h">KaveonDB durable authority</text><text x="1475" y="900" class="b">One governed product and data model</text><text x="1475" y="923" class="b">Journal · manifests · backup · restore</text><path d="M760 608V680" class="ln"/><path d="M1170 608V680" class="or"/><path d="M270 815V840" class="ln"/><path d="M735 815V840" class="ln"/><path d="M1200 815V840" class="or"/>
<text x="55" y="1002" class="foot">Analytical path: request → route → plan → distributed execute → result · Transactional path: validate → revision CAS → commit → audit → recovery</text>
