<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 72" fill="none" role="img" aria-label="Lens">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="64">
      <stop offset="0" stop-color="#e8c547"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Chamfered L (matches Forge's chamfered F) -->
  <path d="M 8 8 L 20 8 L 20 50 L 36 50 L 40 55 L 40 64 L 8 64 Z" fill="url(#g)"/>
  <path d="M 8 8 L 20 8 L 20 15 L 8 15 Z" fill="#d4a017" opacity="0.18"/>

  <!-- Hexagonal crosshair ⊙ (same as Forge's O) -->
  <g transform="translate(48, 10)">
    <circle cx="22" cy="22" r="19" fill="none" stroke="url(#g)" stroke-width="3.2"/>
    <path d="M 26.7 15.24 L 18.84 13.56 L 13.04 20.14 L 15.86 29.76 L 23.72 31.44 L 29.52 24.86 Z" fill="url(#g)" opacity="0.12"/>
    <line x1="26.7" y1="15.24" x2="22" y2="3" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="18.84" y1="13.56" x2="6" y2="11" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="13.04" y1="20.14" x2="6" y2="33" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="15.86" y1="29.76" x2="22" y2="41" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="23.72" y1="31.44" x2="38" y2="33" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="29.52" y1="24.86" x2="38" y2="11" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- NS wordmark (matches Forge RGE sizing) -->
  <text x="100" y="51" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="38" letter-spacing="0.5" fill="url(#g)">NS</text>
</svg>
