<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" fill="none" role="img" aria-label="Lens">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="64">
      <stop offset="0" stop-color="#e8c547"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal crosshair ⊙ — heavier strokes -->
  <g transform="translate(8, 8)">
    <circle cx="28" cy="28" r="25" fill="none" stroke="url(#g)" stroke-width="4.2"/>
    <path d="M 34.4 19.6 L 24.3 17.5 L 16.8 25.8 L 20.5 38.4 L 30.6 40.5 L 38.1 32.2 Z" fill="url(#g)" opacity="0.12"/>
    <line x1="34.4" y1="19.6" x2="28" y2="3.5" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="24.3" y1="17.5" x2="7.5" y2="14" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="16.8" y1="25.8" x2="7.5" y2="42" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="20.5" y1="38.4" x2="28" y2="52.5" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="30.6" y1="40.5" x2="48.5" y2="42" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="38.1" y1="32.2" x2="48.5" y2="14" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
  </g>

  <!-- Chamfered L — 56px tall -->
  <path d="M 72 8 L 84 8 L 84 50 L 100 50 L 104 55 L 104 64 L 72 64 Z" fill="url(#g)"/>
  <path d="M 72 8 L 84 8 L 84 15 L 72 15 Z" fill="#d4a017" opacity="0.18"/>

  <!-- ENS — font-size 56 to match L cap-height exactly, weight 800 -->
  <text x="112" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="56" letter-spacing="1.5" fill="url(#g)">ENS</text>
</svg>
