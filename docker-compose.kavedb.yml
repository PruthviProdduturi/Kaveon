name: kaveon-db

# Standalone local KaveonDB. This file intentionally contains only the Engine;
# it owns the local product catalog.
services:
  kaveon-db:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: kaveon-db
    ports:
      - "127.0.0.1:${KAVEON_DB_PORT:-8080}:8080"
    environment:
      KAVEON_NODE_ID: local-kavedb
      KAVEON_ENVIRONMENT: docker
      KAVEON_COORDINATOR: "true"
      KAVEON_HTTP_PORT: "8080"
      KAVEON_BIND_HOST: "0.0.0.0"
      KAVEON_INSECURE_DEVELOPMENT: "true"
      KAVEON_ADVERTISED_URI: http://kaveon-db:8080
      KAVEON_SECURITY_JSON: >-
        {"principals":[{"token":"${KAVEON_DB_ADMIN_TOKEN:-kaveon-local-admin-token-not-for-production}","principal":"local-admin","role":"admin"}],"bridge_token":"${KAVEON_DB_BRIDGE_TOKEN:-kaveon-local-bridge-token-not-for-production}"}
      KAVEON_DATA_DIR: /data
      KAVEON_CATALOG_ADMIN_TOKEN: ${KAVEON_DB_CATALOG_TOKEN:-kaveon-local-catalog-admin}
      KAVEON_PRODUCT_TRANSACTIONS_ENABLED: "true"
      KAVEON_PRODUCT_STORAGE_MODE: local
      # Point this at the mirrored product-transaction directory when running
      # fully offline (KAVEON_DATA_PATH=data/adls-mirror). Keep the named
      # volume as the default for an empty local install.
      KAVEON_PRODUCT_LOCAL_PATH: ${KAVEON_PRODUCT_LOCAL_PATH:-/var/lib/kaveon/product-transactions}
      KAVEON_PRODUCT_ADLS_PREFIX: kaveon/product-catalog
    volumes:
      - kaveon-db-catalog:/var/lib/kaveon
      - kaveon-db-products:/var/lib/kaveon/product-transactions
      - type: bind
        source: ${KAVEON_DATA_PATH:-./data}
        target: /data
        read_only: true
      - ./engine/etc/coordinator.toml:/etc/kaveon/config.toml:ro
      - ./engine/etc/catalogs:/etc/kaveon/catalogs:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  kaveon-db-catalog:
  kaveon-db-products:
