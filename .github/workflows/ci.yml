name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Note: pnpm-lock.yaml is intentionally gitignored in this repo, so
      # setup-node's pnpm cache can't be used and install runs unfrozen.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check — shared types
        run: pnpm --filter @kaveon/types type-check

      # Soft gate: the codebase predates a committed ESLint config, so lint
      # runs and reports but does not block (same policy as Forge's mypy step).
      - name: Lint (ESLint)
        continue-on-error: true
        run: pnpm --filter kaveon-web lint

      # Soft gate: reports pre-existing type debt without blocking. Production
      # builds are unblocked via next.config.ts (ignoreBuildErrors). Flip this
      # to a hard gate once the errors are burned down.
      - name: Type check (tsc)
        continue-on-error: true
        run: pnpm --filter kaveon-web type-check

      - name: Build
        run: pnpm --filter kaveon-web build

  api:
    name: API — syntax & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kaveon-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/kaveon-api/requirements.txt

      - name: Install system deps (ODBC headers for pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Test (pytest)
        run: |
          if git ls-files '**/test_*.py' '**/*_test.py' | grep -q .; then
            pytest -q --tb=short
          else
            echo "No tests found — skipping pytest"
          fi

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [web]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Link the project explicitly from secrets. `vercel pull` alone can't
      # retrieve settings headlessly ("Could not retrieve Project Settings") —
      # writing .vercel/project.json provides the link it needs.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      # Build ON the GitHub runner (where `pnpm install` works) and upload the
      # prebuilt output. Vercel's own build sandbox trips pnpm's fetch on the
      # public registry (ERR_INVALID_THIS), so we never let it run install.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (prebuilt, on CI)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel
        run: vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
