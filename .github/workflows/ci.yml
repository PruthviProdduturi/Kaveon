name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Runs queue instead of cancelling each other: with two engineers pushing
# minutes apart, cancel-in-progress kept killing the Vercel deploy before it
# finished, so production sat on a stale commit. GitHub keeps only the newest
# pending run per group, so the latest push still deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web — lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check — shared types
        run: pnpm --filter @kaveon/types type-check

      - name: Lint (ESLint)
        run: pnpm --filter kaveon-studio lint

      - name: Type check (tsc)
        run: pnpm --filter kaveon-studio type-check

      - name: Verify public Microsoft sign-in tokens
        run: node --no-warnings --experimental-strip-types --test studio/qualification/entra_auth.mjs

      - name: Verify Engine dashboard query admission
        run: node --no-warnings --experimental-strip-types --test studio/qualification/query_semaphore.mjs

      - name: Validate documentation integrity
        run: node scripts/validate-docs.mjs

      - name: Build
        run: pnpm --filter kaveon-studio build

  api:
    name: API — syntax & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          # Operational source-replay tests restore immutable historical blobs
          # by git object id; a shallow checkout cannot provide those objects.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install system deps (ODBC headers for pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Test (pytest)
        run: |
          if git ls-files '**/test_*.py' '**/*_test.py' | grep -q .; then
            pytest -q --tb=short
          else
            echo "No tests found — skipping pytest"
          fi

      # scripts/ has its own tests and none of them were running: this job sets
      # working-directory to api, so pytest never saw them. They cover the
      # operational paths where a mistake is least recoverable — the system
      # store's backup and restore rehearsal, the events table build, and
      # kaveon-up.sh's environment file, which used to delete an operator's
      # sign-in keys on every re-run.
      # The lake-building tests read and write Parquet, which the API itself
      # does not, so these are installed for this step rather than added to
      # api/requirements.txt and shipped in the API image.
      - name: Install script test dependencies
        # The operational lake tests import the same Delta reader/writer used
        # by the build and append scripts. Keep these out of the API image,
        # but install them explicitly for this test job.
        run: pip install pyarrow numpy deltalake

      - name: Test operational scripts (pytest)
        working-directory: ${{ github.workspace }}
        run: pytest -q --tb=short scripts

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Off unless an installation opts in with KAVEON_VERCEL_DEPLOY=true.
  #
  # This was off because Studio ran on AKS behind its own ingress, and every
  # push republished a second, parallel Studio on Vercel whose AUTH_URL named a
  # host of its own -- so a visitor who reached it was redirected away from the
  # installation they started on. That is no longer the shape of the
  # deployment: the AKS cluster is deallocated, kaveon.io resolves to Vercel,
  # and AUTH_URL names kaveon.io, so Vercel is not a second Studio beside the
  # real one. It is the only one. The original hazard was a stale parallel
  # copy, and there is no longer a copy to be parallel to.
  #
  # If AKS returns as the serving installation, turn the variable off again
  # before pointing kaveon.io back at it, or the old hazard returns with it.
  #
  # The deployment itself is gated on paths below, which is not an
  # optimisation: the free tier allows 100 deployments a day, dev takes
  # hundreds of commits a day, and nearly all of them are Engine or
  # documentation work that cannot change what Studio serves. Deploying on
  # every push spends the day's quota on commits that change nothing and then
  # refuses the push that changes Studio.
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [web]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && vars.KAVEON_VERCEL_DEPLOY == 'true'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the previous tip of the branch.
          fetch-depth: 0

      - name: Decide whether this push changed Studio
        id: scope
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] \
            || [ "$before" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # A new branch, a force-push, or a base that is no longer reachable.
            # Deploy rather than guess: a missed deployment is the failure mode
            # that leaves the live site stale without saying so.
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'No usable base commit; deploying.'
            exit 0
          fi
          if git diff --name-only "$before" '${{ github.sha }}' \
            | grep -qE '^(studio/|packages/|package.json|pnpm-lock.yaml|vercel.json)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Studio changed; deploying.'
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Studio untouched by this push; skipping the deployment.'
          fi

      - name: Install Vercel CLI
        if: steps.scope.outputs.changed == 'true'
        run: npm install -g vercel

      # Remote build now works: vercel.json's installCommand uses `npm install`
      # (npm's fetch avoids the pnpm/undici ERR_INVALID_THIS that broke Vercel's
      # sandbox). Requires a VERCEL_TOKEN scoped to the prodduturi-labs team.
      - name: Deploy to Vercel
        if: steps.scope.outputs.changed == 'true'
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
