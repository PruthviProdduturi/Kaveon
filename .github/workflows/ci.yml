name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check — shared types
        run: pnpm --filter @lens/types type-check

      - name: Lint (ESLint)
        run: pnpm --filter lens-web lint

      - name: Type check (tsc)
        run: pnpm --filter lens-web type-check

      - name: Build
        run: pnpm --filter lens-web build

  api:
    name: API — syntax & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lens-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/lens-api/requirements.txt

      - name: Install system deps (ODBC headers for pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Test (pytest)
        run: |
          if git ls-files '**/test_*.py' '**/*_test.py' | grep -q .; then
            pytest -q --tb=short
          else
            echo "No tests found — skipping pytest"
          fi

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
