name: Demo images

# Publishes multi-architecture images for the public demo host to GHCR:
# ghcr.io/<owner>/kaveon-engine and kaveon-api, tagged :demo and :sha-<commit>.
# Each architecture builds natively on its own runner (no emulation; a Rust
# release build under QEMU takes an hour), then one manifest joins them so the
# same tag serves an Oracle A1 (arm64) host and an amd64 host alike.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-images
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        image: [engine, api]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: engine
            context: engine
            file: engine/Dockerfile
          - image: api
            context: .
            file: api/Dockerfile
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.meta.outputs.owner }}/kaveon-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.description=Kaveon ${{ matrix.image }} for the public demo host; not a production release
          cache-from: type=gha,scope=demo-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.image }}-${{ matrix.arch }}
      - name: Record digest
        shell: bash
        run: |
          mkdir -p digests
          echo -n "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [engine, api]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join architectures under one tag
        shell: bash
        run: |
          image="ghcr.io/${{ steps.meta.outputs.owner }}/kaveon-${{ matrix.image }}"
          refs=""
          for f in digests/${{ matrix.image }}-*; do refs="$refs ${image}@$(cat "$f")"; done
          docker buildx imagetools create -t "$image:demo" -t "$image:sha-${{ steps.meta.outputs.sha }}" $refs
          docker buildx imagetools inspect "$image:demo"
