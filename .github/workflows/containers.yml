name: Containers

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - "api/**"
      - "engine/**"
      - "studio/**"
      - "packages/**"
      - "docker/**"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"
      - ".github/workflows/containers.yml"
  push:
    branches: [dev]
    paths:
      - "api/**"
      - "engine/**"
      - "studio/**"
      - "packages/**"
      - "docker/**"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"
      - ".github/workflows/containers.yml"

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build complete local stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
      - name: Start and await the complete stack
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Smoke-test public endpoints
        run: |
          curl --fail http://localhost:3000/docs
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8081/health
      - name: Print container logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
