name: Engine

on:
  push:
    branches: [dev]
    paths:
      - "engine/**"
  pull_request:
    branches: [dev]
    paths:
      - "engine/**"
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: Build — ${{ matrix.target }}
    needs: check
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kaveon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kaveon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kaveon.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build release
        run: cargo build --release --package kaveon-cli --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaveon-${{ matrix.target }}
          path: engine/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/kaveon-x86_64-unknown-linux-gnu/kaveon release/kaveon-linux-x64
          cp artifacts/kaveon-aarch64-apple-darwin/kaveon release/kaveon-macos-arm64
          cp artifacts/kaveon-x86_64-pc-windows-msvc/kaveon.exe release/kaveon-windows-x64.exe
          chmod +x release/kaveon-linux-x64 release/kaveon-macos-arm64

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-dev
          name: "Kaveon Engine (dev)"
          body: |
            Latest dev build of `kaveon` CLI.

            **Install:** Download the binary for your platform, place it on your PATH.

            ```
            kaveon --data-dir /path/to/parquet/files
            ```
          prerelease: true
          files: release/*
          make_latest: false
