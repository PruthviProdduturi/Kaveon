name: Engine

on:
  push:
    branches: [dev]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  pull_request:
    branches: [dev]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Keep validation tied to the exact source revision. A hung or cancelled
  # run for an older commit must not hold the gate for a newer commit.
  group: engine-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: Build — ${{ matrix.target }}
    needs: check
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kaveon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kaveon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kaveon.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build release
        run: cargo build --release --package kaveon-cli --target ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: CLI workflows against the built binary
        working-directory: ${{ github.workspace }}
        env:
          PYTHONUTF8: "1"
        run: python engine/qualification/cli_workflows.py --cli engine/target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaveon-${{ matrix.target }}
          path: engine/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/kaveon-x86_64-unknown-linux-gnu/kaveon release/kaveon-linux-x64
          cp artifacts/kaveon-aarch64-apple-darwin/kaveon release/kaveon-macos-arm64
          cp artifacts/kaveon-x86_64-pc-windows-msvc/kaveon.exe release/kaveon-windows-x64.exe
          chmod +x release/kaveon-linux-x64 release/kaveon-macos-arm64

      - name: Create dev release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'NOTES'
          Latest development preview of the `kaveon` CLI.

          Download the binary for your platform and place it on your PATH.

          ```
          kaveon --local --data-dir /path/to/parquet/files
          kaveon --server https://localhost:8080 --ca-cert /path/to/ca.crt
          ```
          NOTES
          printf '\nSource commit: `%s`.\n' "$GITHUB_SHA" >> release-notes.md
          if gh release view engine-dev > /dev/null 2>&1; then
            gh release edit engine-dev --title 'Kaveon Engine (dev)' \
              --prerelease --latest=false --notes-file release-notes.md
          else
            gh release create engine-dev --target "$GITHUB_SHA" \
              --title 'Kaveon Engine (dev)' --prerelease --latest=false \
              --notes-file release-notes.md
          fi
          gh release upload engine-dev release/* --clobber

  publish-engine-image:
    name: Publish Engine server image
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      KAVEON_ACR_NAME: ${{ vars.KAVEON_ACR_NAME || 'kaveonacr' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build the Engine server image in ACR
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${AZURE_SUBSCRIPTION_ID:-}" ]] || { echo 'Missing AZURE_SUBSCRIPTION_ID' >&2; exit 1; }
          [[ -n "${AZURE_CLIENT_ID:-}" ]] || { echo 'Missing AZURE_CLIENT_ID' >&2; exit 1; }
          az acr build --registry "$KAVEON_ACR_NAME" --only-show-errors \
            --image "kaveon-engine:${GITHUB_SHA}" \
            --file engine/Dockerfile engine

      - name: Resolve and publish the immutable image digest
        shell: bash
        run: |
          set -Eeuo pipefail
          digest="$(az acr repository show --name "$KAVEON_ACR_NAME" \
            --image "kaveon-engine:${GITHUB_SHA}" --query digest -o tsv --only-show-errors)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo "Unusable Engine digest '$digest'" >&2; exit 1; }
          echo "kaveon-engine:${GITHUB_SHA} -> ${digest}"
          {
            echo '### Engine image'
            echo
            echo "Registry: \`$KAVEON_ACR_NAME\`"
            echo "Repository: \`kaveon-engine\`"
            echo "Digest: \`$digest\`"
            echo
            echo 'The digest is deployable through deploy-aks-engine.yml; no rollout is performed by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
