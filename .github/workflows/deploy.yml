name: Deploy
# Manual only since 2026-10-09.
#
# This deploys the API to the Azure Container App `kaveon-api`, which no
# longer exists: the four container apps and their managed environment were
# deleted with the architect's approval because the demo runs on `kaveon-vm`,
# which builds the API from source. Every push therefore failed at
# "The containerapp 'kaveon-api' does not exist", and a workflow that is
# always red hides the one that matters.
#
# The `az acr build` step above the update still worked, and was building and
# pushing an image on every push to dev that nothing consumed.
#
# Left intact rather than deleted: recreate the container app (infra/bicep)
# and restore `on: push: branches: [dev]` to bring it back.
on:
  workflow_dispatch:

jobs:
  # Web deploys via Vercel CLI manually — not on every push.
  # We hit the 100 deploys/day free tier limit. Deploy web with:
  #   npx vercel --prod --yes

  deploy-api:
    name: Deploy API (Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure
        run: |
          az login --service-principal \
            -u "${{ secrets.AZURE_CLIENT_ID }}" \
            -p "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      - name: Build and push to ACR
        run: |
          az acr build --registry kaveonacr --image kaveon-api:latest --image kaveon-api:${{ github.sha }} --file api/Dockerfile .
      - name: Update Container App
        run: |
          az containerapp update --name kaveon-api --resource-group kaveon-rg --image kaveonacr.azurecr.io/kaveon-api:${{ github.sha }}
