name: Deploy
on:
  push:
    branches: [dev]

jobs:
  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-api:
    name: Deploy API (Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure
        run: |
          az login --service-principal \
            -u "${{ secrets.AZURE_CLIENT_ID }}" \
            -p "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      - name: Build and push to ACR
        run: |
          az acr build --registry kaveonacr --image kaveon-api:latest --image kaveon-api:${{ github.sha }} --file apps/kaveon-api/Dockerfile .
      - name: Update Container App
        run: |
          az containerapp update --name kaveon-api --resource-group kaveon-rg --image kaveonacr.azurecr.io/kaveon-api:${{ github.sha }}
