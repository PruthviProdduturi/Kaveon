name: Deploy Kaveon platform to AKS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: PostgreSQL-free cutover mode
        required: true
        default: rehearsal
        type: choice
        options: [rehearsal, retirement]
  push:
    branches: [dev]
    paths:
      - 'api/**'
      - 'studio/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'infra/helm/kaveon-platform/**'
      - 'scripts/deploy-kaveon-aks.sh'
      - '.github/workflows/deploy-aks-platform.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: kaveon-aks-platform
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'kaveon-rg' }}
  AZURE_AKS_NAME: ${{ vars.AZURE_AKS_NAME || 'kaveon-aks' }}
  KAVEON_ACR_NAME: ${{ vars.KAVEON_ACR_NAME || 'kaveonacr' }}
  KAVEON_NAMESPACE: kaveon
  KAVEON_ADLS_ACCOUNT: ${{ vars.KAVEON_ADLS_ACCOUNT || 'kaveonlake' }}
  KAVEON_ADLS_CONTAINER: ${{ vars.KAVEON_ADLS_CONTAINER || 'product-transactions' }}
  KAVEON_ADLS_ROOT_PATH: ${{ vars.KAVEON_ADLS_ROOT_PATH }}
  KAVEON_API_WORKLOAD_IDENTITY_CLIENT_ID: ${{ vars.KAVEON_API_WORKLOAD_IDENTITY_CLIENT_ID }}
  KAVEON_KEY_VAULT_URL: ${{ vars.KAVEON_KEY_VAULT_URL }}
  KAVEON_ENGINE_BRIDGE_TOKEN: ${{ secrets.KAVEON_ENGINE_BRIDGE_TOKEN }}
  KAVEON_ENGINE_CATALOG_TOKEN: ${{ secrets.KAVEON_ENGINE_CATALOG_TOKEN }}
  KAVEON_CREDENTIAL_ACTIVE_KEY: ${{ secrets.KAVEON_CREDENTIAL_ACTIVE_KEY }}
  KAVEON_CREDENTIAL_KEYS: ${{ secrets.KAVEON_CREDENTIAL_KEYS }}
  AUTH_MICROSOFT_ENTRA_ID_ID: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_ID }}
  AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_ISSUER }}
  AUTH_ENTRA_ADMIN_OBJECT_IDS: ${{ vars.AUTH_ENTRA_ADMIN_OBJECT_IDS }}
  KAVEON_AUTHORITY_FAMILIES: ${{ vars.KAVEON_AUTHORITY_FAMILIES }}
  KAVEON_READ_AUTHORITY_FAMILIES: ${{ vars.KAVEON_READ_AUTHORITY_FAMILIES }}
  KAVEON_EVIDENCE_PVC: ${{ vars.KAVEON_EVIDENCE_PVC || 'kaveon-retirement-evidence' }}
  KAVEON_ENGINE_CA_B64: ${{ secrets.KAVEON_ENGINE_CA_B64 }}

jobs:
  # The images this release is made of, built from the commit being deployed.
  # Their digests used to be Actions variables a person pasted in, which meant
  # a change to api/ reached the cluster only if someone remembered to build
  # an image and edit repository settings. Now the commit produces them.
  build:
    name: Build images
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api: ${{ steps.digests.outputs.api }}
      studio: ${{ steps.digests.outputs.studio }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built in the registry rather than on the runner: the image is then
      # already where the cluster pulls from, and nothing has to push.
      # `az acr build` uses classic Docker with no BuildKit, so neither
      # Dockerfile may use `RUN --mount=type=cache`.
      - name: Build the API and Studio images in ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr build --registry "$KAVEON_ACR_NAME" --only-show-errors \
            --image "kaveon-api:${GITHUB_SHA}" --file api/Dockerfile .
          az acr build --registry "$KAVEON_ACR_NAME" --only-show-errors \
            --image "kaveon-studio:${GITHUB_SHA}" --file studio/Dockerfile .

      # The chart pins by digest, never by tag, so a retag cannot silently
      # change what is running.
      - name: Resolve the digests the chart will pin
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          for image in api studio; do
            digest="$(az acr manifest show \
              --registry "$KAVEON_ACR_NAME" \
              --name "kaveon-${image}:${GITHUB_SHA}" \
              --query digest -o tsv --only-show-errors)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
              || { echo "kaveon-${image}: unusable digest '${digest}'" >&2; exit 1; }
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
            echo "kaveon-${image} -> ${digest}"
          done

  deploy:
    name: Preflight and deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      API_IMAGE_DIGEST: ${{ needs.build.outputs.api }}
      STUDIO_IMAGE_DIGEST: ${{ needs.build.outputs.studio }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.10

      - name: Verify required deployment inputs without printing secrets
        shell: bash
        run: |
          required=(AZURE_SUBSCRIPTION_ID KAVEON_ADLS_ROOT_PATH KAVEON_API_WORKLOAD_IDENTITY_CLIENT_ID KAVEON_KEY_VAULT_URL API_IMAGE_DIGEST STUDIO_IMAGE_DIGEST AUTH_MICROSOFT_ENTRA_ID_ID AUTH_MICROSOFT_ENTRA_ID_ISSUER AUTH_ENTRA_ADMIN_OBJECT_IDS KAVEON_AUTHORITY_FAMILIES KAVEON_READ_AUTHORITY_FAMILIES KAVEON_ENGINE_CA_B64)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "Missing Actions variable/secret: $name" >&2; exit 1; }
          done

      - name: Deploy atomically with PostgreSQL-free preflight
        shell: bash
        env:
          DEPLOY_MODE: ${{ inputs.mode || 'retirement' }}
        run: |
          chmod +x scripts/deploy-kaveon-aks.sh
          ./scripts/deploy-kaveon-aks.sh --mode "$DEPLOY_MODE"
