name: Bug Report
description: Report a bug in Kaveon
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Studio (kaveon-studio)
        - API
        - SQL Lab
        - Chart Builder
        - Dashboards
        - Datasets
        - Data Sources / Connectors
        - AI Assistant
        - Auth / RBAC
        - Setup / Metadata Server
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: datasource
    attributes:
      label: Data source (if relevant)
      options:
        - Not applicable
        - Fabric SQL
        - Azure SQL
        - PostgreSQL
        - MySQL
        - Trino
        - StarRocks

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant logs or error messages.
      render: shell
