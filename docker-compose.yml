name: kaveon

services:
  postgres:
    profiles: [local-postgres]
    image: postgres:17-alpine
    container_name: kaveon-postgres
    environment:
      POSTGRES_DB: kaveonmeta
      POSTGRES_USER: kaveon
      POSTGRES_PASSWORD: ${KAVEON_POSTGRES_PASSWORD:-kaveon-local-only}
    ports:
      - "127.0.0.1:${KAVEON_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./api/schema_postgresql.sql:/docker-entrypoint-initdb.d/10-kaveonmeta.sql:ro
      - ./docker/postgres/20-create-data-database.sql:/docker-entrypoint-initdb.d/20-create-data-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaveon -d kaveonmeta"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  metadata-migrate:
    profiles: [local-postgres]
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${KAVEON_POSTGRES_PASSWORD:-kaveon-local-only}
    volumes:
      - ./api/schema_postgresql.sql:/migrations/schema.sql:ro
    command:
      - psql
      - --host=postgres
      - --username=kaveon
      - --dbname=kaveonmeta
      - --set=ON_ERROR_STOP=1
      - --file=/migrations/schema.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  engine-coordinator:
    build:
      context: ./engine
    container_name: kaveon-engine-coordinator
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAVEON_NODE_ID: coordinator-1
      KAVEON_ENVIRONMENT: docker
      KAVEON_COORDINATOR: "true"
      KAVEON_HTTP_PORT: "8080"
      # This Compose stack is explicitly local; published ports bind loopback.
      KAVEON_BIND_HOST: "0.0.0.0"
      KAVEON_INSECURE_DEVELOPMENT: "true"
      KAVEON_ADVERTISED_URI: http://engine-coordinator:8080
      KAVEON_SECURITY_JSON: >-
        {"principals":[{"token":"${KAVEON_ENGINE_ADMIN_TOKEN:-kaveon-local-admin-token-not-for-production}","principal":"local-admin","role":"admin"}],"bridge_token":"${KAVEON_ENGINE_BRIDGE_TOKEN:-kaveon-local-bridge-token-not-for-production}"}
      KAVEON_DATA_DIR: /data
      KAVEON_EXCHANGE_TOKEN: ${KAVEON_EXCHANGE_TOKEN:-kaveon-local-exchange}
      KAVEON_CATALOG_ADMIN_TOKEN: ${KAVEON_CATALOG_ADMIN_TOKEN:-kaveon-local-catalog-admin}
      # The exchange spool lives on the coordinator's container filesystem. The
      # 10 GiB / 8 GiB defaults refuse (HTTP 507) a repartitioned exact DISTINCT
      # over the 504M-row local lake; these match the AKS coordinator.
      KAVEON_EXCHANGE_DISK_LIMIT_BYTES: ${KAVEON_EXCHANGE_DISK_LIMIT_BYTES:-25769803776}
      KAVEON_EXCHANGE_QUERY_DISK_LIMIT_BYTES: ${KAVEON_EXCHANGE_QUERY_DISK_LIMIT_BYTES:-17179869184}
      # Paged results (the shell's pages, --paged scripts, SQL Lab streaming)
      # spool on the coordinator too: 2 GiB per statement, 4 GiB together,
      # so a script asking the 504M-row lake for a wide filter is not cut
      # off at the 256 MiB default.
      KAVEON_RESULT_QUERY_DISK_LIMIT_BYTES: ${KAVEON_RESULT_QUERY_DISK_LIMIT_BYTES:-2147483648}
      KAVEON_RESULT_DISK_LIMIT_BYTES: ${KAVEON_RESULT_DISK_LIMIT_BYTES:-4294967296}
      # The durable product catalog on the coordinator's state volume: the
      # transaction API and native ANALYZE (exact statistics for the planner),
      # the same profile docker-compose.kavedb.yml runs standalone.
      KAVEON_PRODUCT_TRANSACTIONS_ENABLED: "true"
      KAVEON_PRODUCT_STORAGE_MODE: local
      KAVEON_PRODUCT_LOCAL_PATH: /var/lib/kaveon/product-transactions
      KAVEON_PRODUCT_ADLS_PREFIX: kaveon/product-catalog
    volumes:
      - ./engine/etc/coordinator.toml:/etc/kaveon/config.toml:ro
      - catalog-data:/var/lib/kaveon
      - ./data/adls-mirror/product-transactions:/var/lib/kaveon/product-transactions
      - type: bind
        source: ${KAVEON_DATA_PATH:-./data/adls-mirror/opensource}
        target: /data
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  engine-worker-1:
    build:
      context: ./engine
    container_name: kaveon-engine-worker-1
    depends_on:
      engine-coordinator:
        condition: service_healthy
    environment: &engine-worker-environment
      KAVEON_NODE_ID: worker-1
      KAVEON_ENVIRONMENT: docker
      KAVEON_COORDINATOR: "false"
      KAVEON_HTTP_PORT: "8080"
      KAVEON_BIND_HOST: "0.0.0.0"
      KAVEON_INSECURE_DEVELOPMENT: "true"
      KAVEON_DISCOVERY_URI: http://engine-coordinator:8080
      KAVEON_ADVERTISED_URI: http://engine-worker-1:8080
      KAVEON_DATA_DIR: /data
      KAVEON_EXCHANGE_TOKEN: ${KAVEON_EXCHANGE_TOKEN:-kaveon-local-exchange}
    volumes: &engine-worker-volumes
      - ./engine/etc/worker.toml:/etc/kaveon/config.toml:ro
      - type: bind
        source: ${KAVEON_DATA_PATH:-./data/adls-mirror/opensource}
        target: /data
        read_only: true
    restart: unless-stopped

  engine-worker-2:
    build:
      context: ./engine
    container_name: kaveon-engine-worker-2
    depends_on:
      engine-coordinator:
        condition: service_healthy
    environment:
      <<: *engine-worker-environment
      KAVEON_NODE_ID: worker-2
      KAVEON_ADVERTISED_URI: http://engine-worker-2:8080
    volumes: *engine-worker-volumes
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        PIP_INDEX_URL: ${KAVEON_PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: kaveon-api
    command: ["gunicorn", "main:app", "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8080", "-w", "1", "--timeout", "120"]
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      # Trust only the identity stamped by Studio's authenticated server-side proxy.
      NODE_ENV: production
      API_PORT: "8080"
      WEB_URL: http://localhost:3000
      KAVEON_LOCAL_PRODUCT_MODE: "true"
      KAVEON_POSTGRESQL_RETIREMENT_MODE: "false"
      KAVEONDB_AUTHORITY_FAMILIES: ai_configuration,catalog_sources,data_sources,datasets,dataset_semantics,charts,dashboards,favorites,saved_queries,user_themes,user_recents,query_history,activity,context_cache,dlm_generation,chat_history
      KAVEONDB_READ_AUTHORITY_FAMILIES: datasets,charts,dashboards,saved_queries,user_themes,user_recents,favorites,query_history,activity,chat_history,sources,dlm_definitions
      KAVEON_DLM_LIVE_ARTIFACT_PUBLISH_ENABLED: "true"
      KAVEON_LOCAL_DLM_ARTIFACT_PATH: /var/lib/kaveon/product-transactions
      KAVEON_PROXY_SECRET: ${KAVEON_PROXY_SECRET:-kaveon-local-proxy}
      KAVEON_DEV_USER_EMAIL: ""
      KAVEON_ENGINE_URL: http://engine-coordinator:8080
      KAVEON_ENGINE_PRIVATE_HTTP: "true"
      KAVEON_ENGINE_BRIDGE_TOKEN: ${KAVEON_ENGINE_BRIDGE_TOKEN:-kaveon-local-bridge-token-not-for-production}
      KAVEON_ENGINE_CATALOG_TOKEN: ${KAVEON_CATALOG_ADMIN_TOKEN:-kaveon-local-catalog-admin}
      KAVEON_PRODUCT_REPLAY_ENABLED: "false"
      KAVEON_CREDENTIAL_KEYS: ${KAVEON_CREDENTIAL_KEYS:-}
      KAVEON_CREDENTIAL_ACTIVE_KEY: ${KAVEON_CREDENTIAL_ACTIVE_KEY:-}
    depends_on:
      engine-coordinator:
        condition: service_healthy
    volumes:
      - ./data/adls-mirror/product-transactions:/var/lib/kaveon/product-transactions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  studio:
    build:
      context: .
      dockerfile: studio/Dockerfile
      args:
        NPM_REGISTRY: ${KAVEON_NPM_REGISTRY:-https://registry.npmjs.org}
        API_URL: http://localhost:8082
        WEB_URL: http://localhost:3000
    container_name: kaveon-studio
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      API_URL: http://api:8080
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-kaveon-local-session-secret-change-outside-localhost}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-https://login.microsoftonline.com/common/v2.0}
      KAVEON_LOCAL_MODE: "true"
      KAVEON_PROXY_SECRET: ${KAVEON_PROXY_SECRET:-kaveon-local-proxy}
      KAVEON_DEV_USER_EMAIL: ${KAVEON_DEV_USER_EMAIL:-developer@localhost}
      KAVEON_DEV_USER_NAME: ${KAVEON_DEV_USER_NAME:-Local Developer}
      KAVEON_DEV_USER_ROLE: Admin
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/docs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  catalog-data:
