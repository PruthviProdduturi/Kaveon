<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kaveon architecture: current and target boundaries</title>
  <desc id="desc">A truthful Kaveon architecture showing the implemented Studio proxy and DLM path, the Engine analytical path, legacy PostgreSQL metadata, and target KaveonDB transaction and object storage capabilities.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 38px Inter,Arial,sans-serif;fill:#102a56}.sub{font:400 16px Inter,Arial,sans-serif;fill:#52647e}.h{font:700 17px Inter,Arial,sans-serif;fill:#102a56}.body{font:400 14px Inter,Arial,sans-serif;fill:#334e73}.small{font:400 12px Inter,Arial,sans-serif;fill:#52647e}.tag{font:700 11px Inter,Arial,sans-serif;letter-spacing:1px}.box{stroke:#316fba;stroke-width:2;rx:12}.implemented{fill:#eef6ff}.alpha{fill:#f2f8f5;stroke:#278a78}.target{fill:#fffaf0;stroke:#d38a27;stroke-dasharray:8 6}.legacy{fill:#f3f4f6;stroke:#7c8798;stroke-dasharray:8 6}.line{fill:none;stroke:#387bc4;stroke-width:3;marker-end:url(#blueArrow)}.orangeLine{fill:none;stroke:#d27a21;stroke-width:3;marker-end:url(#orangeArrow)}.grayLine{fill:none;stroke:#7c8798;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#grayArrow)}.section{font:700 13px Inter,Arial,sans-serif;letter-spacing:2px;fill:#2d5b93}.pill{font:700 11px Inter,Arial,sans-serif;fill:#fff}.note{font:400 13px Inter,Arial,sans-serif;fill:#445a78}
    </style>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#387bc4"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d27a21"/></marker>
    <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8798"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <text x="60" y="68" class="title">Kaveon | Connected data intelligence architecture</text>
  <text x="60" y="98" class="sub">A current-state contract with explicit target boundaries</text>
  <g transform="translate(1260,48)"><rect width="18" height="18" rx="4" class="box implemented"/><text x="28" y="14" class="small">Implemented</text><rect x="125" width="18" height="18" rx="4" class="box alpha"/><text x="153" y="14" class="small">Alpha</text><rect x="220" width="18" height="18" rx="4" class="box target"/><text x="248" y="14" class="small">Target</text><rect x="315" width="18" height="18" rx="4" class="box legacy"/><text x="343" y="14" class="small">Legacy bridge</text></g>

  <text x="60" y="150" class="section">IDENTITY AND EXPERIENCE</text>
  <rect x="60" y="170" width="220" height="115" class="box implemented"/><text x="82" y="203" class="h">User / Entra ID</text><text x="82" y="229" class="body">Session identity</text><text x="82" y="250" class="body">Roles and ownership</text><text x="82" y="271" class="body">Bearer authentication</text>
  <rect x="320" y="170" width="240" height="115" class="box implemented"/><text x="344" y="203" class="h">Studio</text><text x="344" y="229" class="body">Chat · Catalog · SQL Lab</text><text x="344" y="250" class="body">Charts · dashboards</text><text x="344" y="271" class="body">Same-origin browser path</text>
  <rect x="600" y="170" width="260" height="115" class="box implemented"/><text x="624" y="203" class="h">Trusted proxy</text><text x="624" y="229" class="body">Server asserted identity</text><text x="624" y="250" class="body">CSRF and session boundary</text><text x="624" y="271" class="body">API request shaping</text>
  <path d="M280 228 H320" class="line"/><path d="M560 228 H600" class="line"/>

  <text x="900" y="150" class="section">CONTROL AND CONTEXT</text>
  <rect x="900" y="170" width="300" height="115" class="box implemented"/><text x="924" y="203" class="h">FastAPI control plane</text><text x="924" y="229" class="body">Auth · policy · source registration</text><text x="924" y="250" class="body">Product APIs · telemetry</text><text x="924" y="271" class="body">Legacy live-source passthrough</text>
  <rect x="1240" y="170" width="300" height="115" class="box alpha"/><text x="1264" y="203" class="h">Deterministic DLM</text><text x="1264" y="229" class="body">Intent and dataset routing</text><text x="1264" y="250" class="body">Compiled context answers</text><text x="1264" y="271" class="body">Clarification and SQL contract</text>
  <rect x="1580" y="170" width="280" height="115" class="box implemented"/><text x="1604" y="203" class="h">DLM context tier</text><text x="1604" y="229" class="body">Answers and value index</text><text x="1604" y="250" class="body">Freshness and coverage</text><text x="1604" y="271" class="body">No scan on a context hit</text>
  <path d="M860 228 H900" class="line"/><path d="M1200 228 H1240" class="line"/><path d="M1540 228 H1580" class="line"/>

  <text x="60" y="350" class="section">DATA SOURCES AND FORMATS</text>
  <rect x="60" y="370" width="260" height="120" class="box implemented"/><text x="84" y="403" class="h">Lake files</text><text x="84" y="429" class="body">Local Parquet / Delta</text><text x="84" y="450" class="body">ADLS Gen2 ranged reads</text><text x="84" y="471" class="body">Snapshot-aware reads</text>
  <rect x="350" y="370" width="260" height="120" class="box implemented"/><text x="374" y="403" class="h">Registered sources</text><text x="374" y="429" class="body">Connection metadata</text><text x="374" y="450" class="body">API-managed SQL sources</text><text x="374" y="471" class="body">No Engine federation claim</text>
  <rect x="640" y="370" width="260" height="120" class="box target"/><text x="664" y="403" class="h">Additional formats</text><text x="664" y="429" class="body">Iceberg adapter</text><text x="664" y="450" class="body">S3 implementation</text><text x="664" y="471" class="body">Connector federation</text><rect x="664" y="480" width="48" height="16" rx="8" fill="#d27a21"/><text x="672" y="492" class="pill">TARGET</text>

  <text x="940" y="350" class="section">ANALYTICAL EXECUTION</text>
  <rect x="940" y="370" width="300" height="120" class="box alpha"/><text x="964" y="403" class="h">Engine coordinator</text><text x="964" y="429" class="body">Parse · optimize · plan</text><text x="964" y="450" class="body">Admission and stage graph</text><text x="964" y="471" class="body">Catalog-resolved fragments</text>
  <rect x="1280" y="370" width="300" height="120" class="box alpha"/><text x="1304" y="403" class="h">Workers and exchange</text><text x="1304" y="429" class="body">Arrow batches · shuffle</text><text x="1304" y="450" class="body">Joins · aggregates · TopN</text><text x="1304" y="471" class="body">Retry and bounded pressure</text>
  <rect x="1620" y="370" width="240" height="120" class="box target"/><text x="1644" y="403" class="h">Mature execution</text><text x="1644" y="429" class="body">Adaptive planning</text><text x="1644" y="450" class="body">Full spill and flow control</text><text x="1644" y="471" class="body">Publication benchmark</text>
  <path d="M900 430 H940" class="line"/><path d="M1240 430 H1280" class="line"/><path d="M1580 430 H1620" class="grayLine"/>

  <text x="60" y="555" class="section">PRODUCT STATE AND MIGRATION</text>
  <rect x="60" y="575" width="300" height="130" class="box legacy"/><text x="84" y="608" class="h">PostgreSQL metadata</text><text x="84" y="634" class="body">Current source authority</text><text x="84" y="655" class="body">Migration snapshots</text><text x="84" y="676" class="body">Outbox and reconciliation</text><rect x="84" y="685" width="55" height="16" rx="8" fill="#7c8798"/><text x="92" y="697" class="pill">LEGACY</text>
  <rect x="410" y="575" width="300" height="130" class="box alpha"/><text x="434" y="608" class="h">KaveonDB record layer</text><text x="434" y="634" class="body">Typed product records</text><text x="434" y="655" class="body">Revision CAS and ownership</text><text x="434" y="676" class="body">Checkpointed migration path</text><rect x="434" y="685" width="46" height="16" rx="8" fill="#278a78"/><text x="443" y="697" class="pill">ALPHA</text>
  <rect x="760" y="575" width="300" height="130" class="box target"/><text x="784" y="608" class="h">Transactional kernel</text><text x="784" y="634" class="body">General row DML and isolation</text><text x="784" y="655" class="body">WAL-equivalent recovery</text><text x="784" y="676" class="body">Multi-record commit</text><rect x="784" y="685" width="48" height="16" rx="8" fill="#d27a21"/><text x="792" y="697" class="pill">TARGET</text>
  <path d="M360 640 H410" class="grayLine"/><path d="M710 640 H760" class="grayLine"/>

  <text x="1110" y="555" class="section">GOVERNANCE AND OPERATIONS</text>
  <rect x="1110" y="575" width="300" height="130" class="box implemented"/><text x="1134" y="608" class="h">Catalog and controls</text><text x="1134" y="634" class="body">Schemas · ownership · audit</text><text x="1134" y="655" class="body">RBAC roles and policy checks</text><text x="1134" y="676" class="body">Secrets kept out of documents</text>
  <rect x="1460" y="575" width="300" height="130" class="box target"/><text x="1484" y="608" class="h">Tenant and data governance</text><text x="1484" y="634" class="body">Tenant isolation evidence</text><text x="1484" y="655" class="body">Lineage and quality contracts</text><text x="1484" y="676" class="body">Retention and lifecycle policy</text><rect x="1484" y="685" width="48" height="16" rx="8" fill="#d27a21"/><text x="1492" y="697" class="pill">TARGET</text>

  <text x="60" y="770" class="section">STORAGE AND RECOVERY</text>
  <rect x="60" y="790" width="400" height="125" class="box implemented"/><text x="84" y="823" class="h">Customer-owned lake</text><text x="84" y="849" class="body">ADLS Gen2 today · Parquet / Delta</text><text x="84" y="870" class="body">Immutable object identity and manifests</text><text x="84" y="891" class="body">Kaveon does not silently copy customer rows</text>
  <rect x="510" y="790" width="400" height="125" class="box alpha"/><text x="534" y="823" class="h">Catalog and transaction journal</text><text x="534" y="849" class="body">SQLite/WAL coordinator catalog today</text><text x="534" y="870" class="body">Typed records and receipts</text><text x="534" y="891" class="body">ADLS durable head is target</text>
  <rect x="960" y="790" width="400" height="125" class="box target"/><text x="984" y="823" class="h">Recovery evidence</text><text x="984" y="849" class="body">Backup/restore rehearsal</text><text x="984" y="870" class="body">Rollback and crash recovery</text><text x="984" y="891" class="body">PostgreSQL-unavailable test</text><rect x="984" y="897" width="48" height="16" rx="8" fill="#d27a21"/><text x="992" y="909" class="pill">TARGET</text>
  <rect x="1410" y="790" width="400" height="125" class="box implemented"/><text x="1434" y="823" class="h">Deployment and evidence</text><text x="1434" y="849" class="body">Helm · Bicep · immutable images</text><text x="1434" y="870" class="body">Health endpoints and query telemetry</text><text x="1434" y="891" class="body">AKS recreate runbook</text>
  <path d="M260 705 V790" class="line"/><path d="M610 705 V790" class="line"/><path d="M1160 705 V790" class="grayLine"/>

  <text x="60" y="1000" class="note">Current truth is intentionally narrower than the target: PostgreSQL remains the migration authority until every retirement gate passes.</text>
  <text x="60" y="1032" class="sub">Kaveon — talk to your data · implemented components are solid, target components are outlined</text>
</svg>
