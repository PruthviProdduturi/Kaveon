<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="engine-title engine-desc">
  <title id="engine-title">Kaveon Engine query pipeline</title>
  <desc id="engine-desc">Current SQL planning and vectorized execution feed the local Parquet reader. Logical optimizer pushdown, Sort and TopN, cloud stores, Delta, and Iceberg are marked as targets. Solid paths are current and dashed paths are target.</desc>
  <defs>
    <marker id="engine-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1l9 4-9 4z" fill="#4A9EE8"/></marker>
    <style>
      .word{fill:#f8fafc}.title{font:600 25px Inter,Segoe UI,sans-serif;fill:#f8fafc}.heading{font:600 18px Inter,Segoe UI,sans-serif;fill:#f8fafc}.body{font:400 13px Inter,Segoe UI,sans-serif;fill:#9aa7b8}.label{font:700 10px Inter,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#718096}.box{fill:#101620;stroke:#263244;stroke-width:1.5}.active{stroke:#4A9EE8}.flow{fill:none;stroke:#4A9EE8;stroke-width:2;marker-end:url(#engine-arrow)}.target{stroke-dasharray:8 7;animation:engine-flow 4s linear infinite}.rule{stroke:#263244}.note{font:500 12px Inter,Segoe UI,sans-serif;fill:#718096}@keyframes engine-flow{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.target{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="680" rx="20" fill="#0b0f15"/>
  <g transform="translate(496 20) scale(.18)"><g class="word"><rect x="90" y="70" width="20" height="165"/><polygon points="108.73,161.2 215.73,86.39 204.27,70 97.27,144.8"/><polygon points="97.51,161.36 209.51,235 220.49,218.29 108.49,144.64"/><path d="M260 235L330 70H350L420 235H397L340 104L283 235Z"/><path d="M465 70H488L545 201L602 70H625L555 235H535Z"/><rect x="675" y="70" width="20" height="165"/><rect x="675" y="70" width="130" height="20"/><rect x="675" y="142.5" width="108" height="20"/><rect x="675" y="215" width="130" height="20"/><rect x="1060" y="70" width="20" height="165"/><rect x="1195" y="70" width="20" height="165"/><polygon points="1062.53,83.3 1197.53,235 1212.47,221.7 1077.47,70"/></g><path d="M966.25 215.29A72.5 72.5 0 1 0 893.75 215.29" fill="none" stroke="#4A9EE8" stroke-width="20"/></g>
  <text x="600" y="76" text-anchor="middle" class="note">Talk to your data.</text>
  <text x="600" y="112" text-anchor="middle" class="title">Engine · Vectorized Query Pipeline</text>
  <line x1="56" y1="140" x2="1144" y2="140" class="rule"/>

  <text x="60" y="178" class="label">QUERY PIPELINE · CURRENT WITH TARGET OPTIMIZER STAGE</text>
  <g><rect class="box active" x="60" y="196" width="188" height="100" rx="14"/><text x="154" y="235" text-anchor="middle" class="heading">SQL</text><text x="154" y="262" text-anchor="middle" class="body">Parser → logical plan</text></g>
  <path class="flow target" d="M248 246h48"/>
  <g><rect class="box" x="304" y="196" width="210" height="100" rx="14"/><text x="409" y="231" text-anchor="middle" class="heading">Logical optimizer</text><text x="409" y="256" text-anchor="middle" class="body">Filter pushdown</text><text x="409" y="277" text-anchor="middle" class="label">TARGET</text></g>
  <path class="flow target" d="M514 246h48"/>
  <path class="flow" d="M248 286c92 54 220 54 314 0"/>
  <g><rect class="box" x="570" y="196" width="210" height="100" rx="14"/><text x="675" y="235" text-anchor="middle" class="heading">Physical plan</text><text x="675" y="262" text-anchor="middle" class="body">BatchOperator pipeline</text></g>
  <path class="flow" d="M780 246h48"/>
  <g><rect class="box active" x="836" y="180" width="304" height="132" rx="14"/><text x="988" y="221" text-anchor="middle" class="heading">Vectorized execution</text><text x="988" y="250" text-anchor="middle" class="body">Scan · Filter · Project · Aggregate · Limit</text><text x="988" y="278" text-anchor="middle" class="label">ARROW RECORD BATCH</text><text x="988" y="297" text-anchor="middle" class="label">SORT · TOPN TARGET</text></g>

  <path class="flow" d="M988 312v60"/>
  <text x="60" y="366" class="label">DATA PLANE</text>
  <g><rect class="box active" x="650" y="386" width="490" height="130" rx="14"/><text x="895" y="426" text-anchor="middle" class="heading">Parquet reader · current</text><text x="895" y="455" text-anchor="middle" class="body">Projection · metadata statistics · row-group pruning · decoding</text><text x="895" y="482" text-anchor="middle" class="label">BATCHSOURCE · LOCAL FILESYSTEM</text></g>
  <path class="flow" d="M650 451H586"/>
  <g><rect class="box" x="60" y="386" width="518" height="130" rx="14"/><text x="319" y="426" text-anchor="middle" class="heading">Customer-controlled data</text><text x="319" y="455" text-anchor="middle" class="body">Local Parquet · current</text><text x="319" y="482" text-anchor="middle" class="body">ADLS Gen2 · S3 · Delta · Iceberg · target</text></g>

  <g transform="translate(60 554)"><line x1="0" y1="0" x2="38" y2="0" class="flow"/><text x="52" y="5" class="body">Current contract</text><line x1="210" y1="0" x2="248" y2="0" class="flow" stroke-dasharray="8 7"/><text x="262" y="5" class="body">Target contract</text></g>
  <rect x="60" y="596" width="1080" height="48" rx="10" fill="#0e141d" stroke="#263244"/><text x="600" y="625" text-anchor="middle" class="body">Safety invariant · uncertain, absent, nested, or incompatible statistics retain data; pruning never guesses.</text>
</svg>
