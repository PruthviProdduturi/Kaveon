<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Kaveon premium technical architecture</title>
<desc id="desc">A concise five-zone Kaveon architecture showing experience, control, distributed execution, durable data, and trust operations.</desc>
<defs>
 <style>
  .bg{fill:#f7f9fc}.title{font:700 40px Inter,Arial,sans-serif;fill:#102a56}.sub{font:400 17px Inter,Arial,sans-serif;fill:#61728c}.zone{fill:#fff;stroke:#cad7e8;stroke-width:2;rx:18}.zoneTitle{font:700 20px Inter,Arial,sans-serif;fill:#102a56}.kicker{font:700 12px Inter,Arial,sans-serif;letter-spacing:2px;fill:#3970a8}.h{font:700 17px Inter,Arial,sans-serif;fill:#102a56}.body{font:400 14px Inter,Arial,sans-serif;fill:#415b7d}.small{font:400 12px Inter,Arial,sans-serif;fill:#61728c}.line{fill:none;stroke:#2f78c3;stroke-width:4;marker-end:url(#b)}.orange{fill:none;stroke:#d37a21;stroke-width:4;marker-end:url(#o)}.dash{fill:none;stroke:#d37a21;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#o)}.pillA{fill:#e9f5f1;stroke:#278a78;stroke-width:1}.pillT{fill:#fff3df;stroke:#d37a21;stroke-width:1}.pillL{fill:#eef0f3;stroke:#7c8798;stroke-width:1}.pillText{font:700 11px Inter,Arial,sans-serif}.foot{font:400 14px Inter,Arial,sans-serif;fill:#52647e}
 </style>
 <marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#2f78c3"/></marker>
 <marker id="o" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#d37a21"/></marker>
</defs>
<rect width="1920" height="1080" class="bg"/>
<text x="70" y="72" class="title">Kaveon | Unified data intelligence</text>
<text x="70" y="105" class="sub">A governed analytical and transactional platform over customer-owned lake storage</text>
<g transform="translate(1430,60)"><rect width="18" height="18" rx="5" class="pillA"/><text x="28" y="14" class="small">Current / alpha</text><rect x="145" width="18" height="18" rx="5" class="pillT"/><text x="173" y="14" class="small">Target</text><rect x="250" width="18" height="18" rx="5" class="pillL"/><text x="278" y="14" class="small">Legacy bridge</text></g>

<!-- Experience zone -->
<rect x="70" y="150" width="1780" height="150" class="zone"/>
<text x="100" y="185" class="kicker">01 · EXPERIENCE</text><text x="100" y="222" class="zoneTitle">One product surface</text><text x="100" y="251" class="body">Studio, SQL Lab, charts, dashboards, chat, catalog and remote CLI</text>
<rect x="770" y="185" width="250" height="75" rx="12" class="zone"/><text x="800" y="216" class="h">User + Entra identity</text><text x="800" y="240" class="small">Session · roles · ownership</text>
<rect x="1050" y="185" width="250" height="75" rx="12" class="zone"/><text x="1080" y="216" class="h">Trusted proxy</text><text x="1080" y="240" class="small">Same-origin · CSRF · asserted identity</text>
<rect x="1330" y="185" width="250" height="75" rx="12" class="zone"/><text x="1360" y="216" class="h">FastAPI control plane</text><text x="1360" y="240" class="small">Auth · policy · product APIs</text>
<path d="M1020 222H1050" class="line"/><path d="M1300 222H1330" class="line"/>

<!-- Control zone -->
<rect x="70" y="340" width="1780" height="190" class="zone"/>
<text x="100" y="375" class="kicker">02 · CONTROL AND SEMANTICS</text>
<rect x="100" y="400" width="500" height="95" rx="12" fill="#eef6ff" stroke="#397bc2" stroke-width="2"/><text x="130" y="433" class="h">Deterministic DLM</text><text x="130" y="458" class="body">Routes intent → dataset → metric → dimension</text><text x="130" y="480" class="body">Context hit returns a compiled answer; otherwise emits a SQL contract</text><rect x="510" y="410" width="70" height="20" rx="10" class="pillA"/><text x="523" y="425" class="pillText" fill="#237764">ALPHA</text>
<rect x="640" y="400" width="500" height="95" rx="12" fill="#eef6ff" stroke="#397bc2" stroke-width="2"/><text x="670" y="433" class="h">Catalog and policy plane</text><text x="670" y="458" class="body">Registered sources · schema identity · ownership · audit</text><text x="670" y="480" class="body">RBAC and bounded query admission</text><rect x="1050" y="410" width="70" height="20" rx="10" class="pillA"/><text x="1063" y="425" class="pillText" fill="#237764">CURRENT</text>
<rect x="1180" y="400" width="610" height="95" rx="12" fill="#f2f8f5" stroke="#278a78" stroke-width="2"/><text x="1210" y="433" class="h">DLM context tier</text><text x="1210" y="458" class="body">Compiled answers · value index · freshness · clarification state</text><text x="1210" y="480" class="body">Separate from transactional records and scan execution</text><rect x="1700" y="410" width="70" height="20" rx="10" class="pillA"/><text x="1713" y="425" class="pillText" fill="#237764">CURRENT</text>

<!-- execution zone -->
<rect x="70" y="570" width="1780" height="190" class="zone"/>
<text x="100" y="605" class="kicker">03 · EXECUTION</text>
<rect x="100" y="630" width="500" height="95" rx="12" fill="#eef6ff" stroke="#397bc2" stroke-width="2"/><text x="130" y="663" class="h">Engine coordinator</text><text x="130" y="688" class="body">Parse · optimize · exact statistics · stage graph</text><text x="130" y="710" class="body">Admission · cancellation · query evidence</text><rect x="510" y="640" width="70" height="20" rx="10" class="pillA"/><text x="523" y="655" class="pillText" fill="#237764">ALPHA</text>
<rect x="640" y="630" width="500" height="95" rx="12" fill="#f2f8f5" stroke="#278a78" stroke-width="2"/><text x="670" y="663" class="h">Distributed workers</text><text x="670" y="688" class="body">Arrow batches · joins · aggregates · Sort/TopN</text><text x="670" y="710" class="body">Exchange, retry and bounded memory foundations</text><rect x="1050" y="640" width="70" height="20" rx="10" class="pillA"/><text x="1063" y="655" class="pillText" fill="#237764">ALPHA</text>
<rect x="1180" y="630" width="610" height="95" rx="12" fill="#fffaf0" stroke="#d37a21" stroke-width="2" stroke-dasharray="9 8"/><text x="1210" y="663" class="h">Scale-out maturity</text><text x="1210" y="688" class="body">Adaptive planning · complete spill/flow control · publication throughput</text><text x="1210" y="710" class="body">Target evidence, not a present capability claim</text><rect x="1700" y="640" width="70" height="20" rx="10" class="pillT"/><text x="1713" y="655" class="pillText" fill="#a05d16">TARGET</text>
<path d="M850 530V570" class="line"/>

<!-- data zone -->
<rect x="70" y="800" width="1780" height="150" class="zone"/>
<text x="100" y="835" class="kicker">04 · DURABLE DATA</text>
<rect x="100" y="855" width="430" height="65" rx="12" class="zone"/><text x="130" y="883" class="h">Customer lake</text><text x="130" y="905" class="small">ADLS Gen2 · Parquet · Delta (current)</text>
<rect x="580" y="855" width="430" height="65" rx="12" class="zone"/><text x="610" y="883" class="h">KaveonDB record layer</text><text x="610" y="905" class="small">Typed records · revision CAS · migration alpha</text>
<rect x="1060" y="855" width="350" height="65" rx="12" fill="#fffaf0" stroke="#d37a21" stroke-width="2" stroke-dasharray="9 8"/><text x="1090" y="883" class="h">Transactional kernel</text><text x="1090" y="905" class="small">General DML · isolation · durable recovery (target)</text>
<rect x="1460" y="855" width="330" height="65" rx="12" class="zone"/><text x="1490" y="883" class="h">Evidence and restore</text><text x="1490" y="905" class="small">Checkpoints · telemetry · rollback gates</text>
<path d="M315 950V980H1210V950" class="orange"/><path d="M795 950V980" class="grayLine"/>

<!-- trust rail -->
<rect x="70" y="985" width="1780" height="48" rx="12" fill="#102a56"/><text x="100" y="1015" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">05 · TRUST AND OPERATIONS</text><text x="380" y="1015" font-family="Inter,Arial,sans-serif" font-size="14" fill="#dbe9f7">Helm · Bicep · immutable images · health · metrics · audit · workload identity · backup/restore qualification</text>
<text x="70" y="1065" class="foot">Current implementation is narrower than the target. PostgreSQL remains the migration authority until all retirement gates pass.</text>
</svg>
