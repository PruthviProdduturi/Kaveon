<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Inside Kaveon</title>
  <desc id="desc">Studio sends requests through its authenticated API. The Data Language Model resolves questions against compiled dataset context and can return an answer or generate SQL. The Engine distributes lake queries across workers reading Parquet or Delta. KaveonDB commits product edits as versioned records.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#101c29"/><stop offset="1" stop-color="#10151d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="m1 1 4.5 2.5L1 6" fill="none" stroke="#8ea0b4" stroke-width="1.3"/>
    </marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .heading{font-size:22px;font-weight:650;fill:#f2f6fa}
      .label{font-size:17px;font-weight:600;fill:#e1e8ef}
      .detail{font-size:16px;fill:#aec0cf}
      .route{fill:none;stroke:#6e8196;stroke-width:1.6}
      .icon{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="918" height="478" rx="18" fill="#0d1218" stroke="#35414d"/>
  <path d="M19 1h882q18 0 18 18v86H1V19Q1 1 19 1Z" fill="url(#surface)"/>
  <path d="M1 105h918" stroke="#303c49"/>
  <!-- Studio is the common entry point. The three branches describe different requests. -->
  <g transform="translate(33 31)" class="icon" color="#75baff">
    <rect x="0" y="0" width="37" height="31" rx="5"/><path d="M1 9h35M10 10v20"/>
  </g>
  <text x="90" y="54" font-size="32" font-weight="650" fill="#f4f7fa">Kaveon Studio</text>
  <text x="91" y="82" class="detail">Chat, SQL Lab, charts and dashboards</text>
  <text x="883" y="58" text-anchor="end" class="label">Authenticated Studio API</text>

  <path d="M51 105v306" class="route"/>
  <g class="route" marker-end="url(#arrow)">
    <path d="M51 168h146"/><path d="M51 292h146"/><path d="M51 411h146"/>
    <path d="M510 168h61"/><path d="M510 292h61"/><path d="M510 411h61"/>
    <path d="M240 201v52"/>
  </g>
  <g fill="#0d1218" stroke="#7cbfff" stroke-width="2">
    <circle cx="51" cy="168" r="4"/><circle cx="51" cy="292" r="4"/>
    <circle cx="51" cy="411" r="4" stroke="#63cbb8"/>
  </g>
  <g class="label">
    <text x="67" y="155">Ask</text><text x="67" y="279">Query</text><text x="67" y="398">Save</text>
  </g>

  <g transform="translate(210 144)" class="icon" color="#7cbfff">
    <path d="M2 10 23 1l21 9-21 9Zm0 8 21 9 21-9M2 26l21 9 21-9"/>
  </g>
  <text x="273" y="162" class="heading">Data Language Model</text>
  <text x="273" y="188" class="detail">Resolve metrics and dimensions</text>
  <text x="586" y="162" class="label">Answer from context</text>
  <text x="586" y="188" class="detail">Use a precomputed answer when fresh.</text>
  <text x="255" y="233" class="detail" fill="#7cbfff">Generated SQL</text>

  <g transform="translate(210 270)" class="icon" color="#7cbfff">
    <path d="M23 10v8M4 24v-6h38v6"/><rect x="17" width="12" height="10" rx="2"/>
    <rect x="0" y="24" width="9" height="9" rx="2"/><rect x="19" y="24" width="9" height="9" rx="2"/><rect x="38" y="24" width="9" height="9" rx="2"/><path d="M23 18v6"/>
  </g>
  <text x="273" y="286" class="heading">Kaveon Engine</text>
  <text x="273" y="312" class="detail">Coordinator and Arrow workers</text>
  <text x="586" y="286" class="label">Read lake tables in place</text>
  <text x="586" y="312" class="detail">Parquet and Delta on local disk or ADLS.</text>

  <path d="M86 351h796" stroke="#2c3742"/>
  <g transform="translate(212 389)" class="icon" color="#63cbb8">
    <ellipse cx="20" cy="7" rx="18" ry="6"/><path d="M2 7v22c0 8 36 8 36 0V7M2 18c0 8 36 8 36 0"/>
  </g>
  <text x="273" y="405" class="heading">KaveonDB</text>
  <text x="273" y="431" class="detail">Commit a product edit</text>
  <text x="586" y="405" class="label">Versioned product records</text>
  <text x="586" y="431" class="detail">Datasets, saved queries, charts, dashboards.</text>
</svg>
