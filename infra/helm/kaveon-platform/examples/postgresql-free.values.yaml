# Non-secret example for the first PostgreSQL-free restart rehearsal.
# Replace every angle-bracket placeholder. Keep credentials in the referenced
# Secret, never in this file. Use immutable image digests from one release.
images:
  api: {repository: <registry>/kaveon-api, digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
  studio: {repository: <registry>/kaveon-studio, digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}
  # Retained for rollback; not rendered in PostgreSQL-free modes.
  postgres: {repository: <registry>/postgres, digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc}

secrets:
  portalAuth: kaveon-portal-auth
engine:
  service: kaveon-coordinator.kaveon.svc.cluster.local
  port: 8080
  caConfigMap: kaveon-engine-ca
  caKey: ca.crt
seed:
  catalog: OpenSource
  name: OpenSource
  adls:
    account: <lake-storage-account>
    container: opensource
    rootPath: snapshots/<qualified-snapshot>
  credentialRef: kaveon-test-reader

api:
  evidenceStorage:
    create: true
    name: kaveon-retirement-evidence
    storageClass: azurefile-csi
    size: 1Gi
    accessModes: [ReadWriteMany]
    retain: true
  cutover:
    # First PostgreSQL-free boot: true/false. For final retirement, change only
    # these two values to false/true after the complete final audit is mounted.
    restartRehearsalMode: true
    retirementMode: false
    authorityFamilies: activity,ai_configuration,catalog_sources,charts,chat_history,context_cache,dashboards,data_sources,dataset_semantics,datasets,dlm_generation,favorites,query_history,saved_queries,user_recents,user_themes
    readAuthorityFamilies: activity,charts,chat_history,dashboards,datasets,dlm_definitions,favorites,query_history,saved_queries,sources,user_recents,user_themes
    evidencePvc: kaveon-retirement-evidence
    evidencePath: /retirement/postgresql-reconciliation-evidence.json
    auditPath: /retirement/postgresql-retirement-audit.json
    reportDirectory: /retirement/family-reports
    receiptDirectory: /retirement/receipts
    maxAgeHours: 24
    postgresqlWriteFence: true
    liveDlmArtifactPublish: true
    artifactAccount: <product-storage-account>
    artifactContainer: product-transactions
    shadowReads:
      sources: false
      datasets: false
      charts: false
      dashboards: false
      userThemes: false
      favorites: false
      userRecents: false
      queryHistory: false
      savedQueries: false
      activity: false
      chatHistory: false
      dlmDefinitions: false
    outbox:
      charts: false
      dashboards: false
      savedQueries: false
      queryHistory: false
      activity: false
      chatHistory: false
  productReplay:
    enabled: false
  workloadIdentity:
    clientId: <api-workload-identity-client-id>
  keyVaultUrl: https://<vault-name>.vault.azure.net/
  # These completed migration locations stay auditable; the Job remains off.
  dlmRunMigration:
    enabled: false
    artifactAccount: <product-storage-account>
    artifactContainer: product-transactions
    checkpointAccount: <product-storage-account>
    checkpointContainer: migration-staging
    checkpointPrefix: postgresql-retirement/<immutable-run-id>/dlm-runs
  retirementReports:
    enabled: false
    evidencePvc: kaveon-retirement-evidence
    maxAgeHours: 1
  postgresqlFreeSmoke:
    enabled: true
    baseUrl: http://kaveon-api.kaveon.svc.cluster.local:8080
    allowedHosts: ""
    identity: <migrated-fixture-owner-email>
    datasetId: <visible-ready-dlm-dataset-id>
    question: <bounded-qualified-question>
    evidencePvc: kaveon-retirement-evidence
    outputFile: receipts/postgresql-free-smoke.json
    useCaCert: false
