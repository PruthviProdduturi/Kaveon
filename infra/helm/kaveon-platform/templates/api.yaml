{{- $retirement := .Values.api.cutover.retirementMode }}
{{- $rehearsal := .Values.api.cutover.restartRehearsalMode }}
{{- if and $retirement $rehearsal }}{{ fail "api.cutover retirement and rehearsal modes are mutually exclusive" }}{{ end }}
{{- if or $retirement $rehearsal }}
{{- $_ := required "api.cutover.evidencePvc is required for PostgreSQL-free mode" .Values.api.cutover.evidencePvc }}
{{- if and .Values.api.evidenceStorage.create (ne .Values.api.cutover.evidencePvc .Values.api.evidenceStorage.name) }}{{ fail "api.cutover.evidencePvc must name the chart-managed evidence PVC" }}{{ end }}
{{- $_ := required "api.cutover.authorityFamilies is required for PostgreSQL-free mode" .Values.api.cutover.authorityFamilies }}
{{- $_ := required "api.cutover.readAuthorityFamilies is required for PostgreSQL-free mode" .Values.api.cutover.readAuthorityFamilies }}
{{- $_ := required "api.cutover.artifactAccount is required for PostgreSQL-free mode" .Values.api.cutover.artifactAccount }}
{{- $_ := required "api.cutover.artifactContainer is required for PostgreSQL-free mode" .Values.api.cutover.artifactContainer }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaveon-api
  namespace: kaveon
  annotations:
    azure.workload.identity/client-id: {{ required "api.workloadIdentity.clientId is required" .Values.api.workloadIdentity.clientId | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: kaveon-api
  namespace: kaveon
spec:
  selector:
    app: kaveon-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaveon-api
  namespace: kaveon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaveon-api
  template:
    metadata:
      labels:
        app: kaveon-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: kaveon-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
{{- if not (or $retirement $rehearsal) }}
      initContainers:
        - name: require-product-migration-schema
          image: {{ include "portal.image" (list .Values.images.api "api") }}
          command: [python, -c]
          args:
            - |
              import os, time
              import psycopg2
              options = dict(host="kaveon-postgres", port="5432", dbname="kaveonmeta",
                             user="kaveon", password=os.environ["METADATA_PASSWORD"])
              for attempt in range(60):
                  try:
                      with psycopg2.connect(**options) as connection:
                          with connection.cursor() as cursor:
                              cursor.execute("""
                                  SELECT EXISTS (
                                    SELECT 1 FROM information_schema.columns
                                    WHERE table_schema = 'public'
                                      AND table_name = 'product_migration_outbox'
                                      AND column_name = 'owner_principal'
                                      AND is_nullable = 'NO'
                                  )
                              """)
                              if cursor.fetchone()[0]:
                                  break
                  except psycopg2.OperationalError:
                      pass
                  if attempt == 59:
                      raise RuntimeError("required product migration schema is unavailable")
                  time.sleep(2)
          env:
            - {name: METADATA_PASSWORD, valueFrom: {secretKeyRef: {name: {{ required "secrets.portalAuth is required" .Values.secrets.portalAuth }}, key: METADATA_PASSWORD}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
{{- end }}
      containers:
        - name: api
          image: {{ include "portal.image" (list .Values.images.api "api") }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - name: http
              containerPort: 8080
          env:
{{- include "portal.apiEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: engine-ca, mountPath: /var/run/kaveon/engine-ca, readOnly: true}
{{- if or $retirement $rehearsal }}
            - {name: retirement-evidence, mountPath: /retirement, readOnly: true}
{{- end }}
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: engine-ca
{{- if .Values.engine.caSecret }}
          secret: {secretName: {{ .Values.engine.caSecret }}}
{{- else }}
          configMap: {name: {{ required "engine.caConfigMap is required when engine.caSecret is empty" .Values.engine.caConfigMap }}}
{{- end }}
{{- if or $retirement $rehearsal }}
        - name: retirement-evidence
          persistentVolumeClaim: {claimName: {{ .Values.api.cutover.evidencePvc }}}
{{- end }}
