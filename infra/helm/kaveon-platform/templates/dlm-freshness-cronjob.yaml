{{- if .Values.api.dlmFreshness.enabled }}
{{- /*
  Recompiles the DLM context of any dataset whose source has changed.

  What Studio reports about a dataset — its row count, its date range, which
  values it can answer without a scan — is recorded when the context is
  compiled, not measured when it is read. A table taking a daily append
  therefore keeps reporting yesterday's numbers: the data moved, nothing in
  the product catalog did, and nothing said the recorded numbers were now
  wrong.

  `check_freshness` has always detected this, by comparing the source identity
  the artifact recorded against the table's current one. What was missing was
  anything acting on it unattended. The in-process sweep thread returns
  immediately whenever the PostgreSQL-free runtime is requested, and the sweep
  needs a caller identity to read compiled artifacts at all, which a thread
  started at import has none of — so on this installation context was
  refreshed only by someone pressing a button.

  A job rather than the API, because compiling a half-billion-row table is not
  a request-sized amount of work: one such rebuild exceeded the API's memory
  limit and the kernel killed the pod mid-generation, which leaves the dataset
  with its old context already invalidated. Here it gets its own limits and
  its own process, and a rebuild that runs out of memory costs that dataset
  its freshness instead of taking the request path down.
*/}}
{{- $retirement := .Values.api.cutover.retirementMode }}
{{- $rehearsal := .Values.api.cutover.restartRehearsalMode }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kaveon-dlm-freshness
  namespace: {{ .Release.Namespace }}
  labels:
    app: kaveon-dlm-freshness
spec:
  schedule: {{ .Values.api.dlmFreshness.schedule | quote }}
  # Two sweeps would recompile the same dataset at once and race to publish
  # its artifact. A late run waits for its turn.
  concurrencyPolicy: Forbid
  # A sweep that starts late still compares against current sources, so a
  # missed window is better skipped than queued behind the clock.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt. A rebuild that failed on memory fails the same way again
      # immediately, and the next schedule is the retry — a backoff loop would
      # just hold the Forbid lock while repeating it.
      backoffLimit: 0
      # Bounded so a dataset that cannot finish compiling does not hold the
      # Forbid lock until the next schedule, which would silently stop the
      # sweep altogether.
      activeDeadlineSeconds: {{ .Values.api.dlmFreshness.timeoutSeconds }}
      template:
        metadata:
          labels:
            app: kaveon-dlm-freshness
            azure.workload.identity/use: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: kaveon-api
          automountServiceAccountToken: false
          # The same identity the API pod runs as. `runAsNonRoot` alone is not
          # enough: the image declares no USER, so the kubelet refuses the
          # container with CreateContainerConfigError rather than picking a uid
          # for it — a failure that repeats every schedule and produces no
          # application log to notice it by.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: sweep
              image: {{ include "portal.image" (list .Values.images.api "api") }}
              command: ["python", "-m", "services.dlm_freshness_job"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
{{- include "portal.apiEnv" . | nindent 16 }}
                # Compiled context is owned content: listing it needs an
                # identity and recompiling it writes under one. The schedule
                # is given a principal explicitly rather than inheriting an
                # ambient administrator, and the job refuses to run without
                # one rather than silently checking nothing.
                - {name: KAVEON_DLM_SWEEP_ACTOR, value: {{ required "api.dlmFreshness.actor is required when dlmFreshness is enabled" .Values.api.dlmFreshness.actor | quote }}}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: engine-ca, mountPath: /var/run/kaveon/engine-ca, readOnly: true}
{{- if or $retirement $rehearsal }}
                # The same evidence the API reads. It shares the API's whole
                # environment, including the paths this mount supplies, so a
                # job without it would be configured to look for cutover
                # evidence at a path that does not exist in its container.
                - {name: retirement-evidence, mountPath: /retirement, readOnly: true}
{{- end }}
              # Sized for a context compile rather than a request. The API's
              # own limit is what a half-billion-row rebuild exceeded, and
              # that pod has requests to serve; this one has nothing else to
              # do with the memory.
              resources: {{- toYaml .Values.api.dlmFreshness.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: engine-ca
{{- if .Values.engine.caSecret }}
              secret: {secretName: {{ .Values.engine.caSecret }}}
{{- else }}
              configMap: {name: {{ required "engine.caConfigMap is required when engine.caSecret is empty" .Values.engine.caConfigMap }}}
{{- end }}
{{- if or $retirement $rehearsal }}
            - name: retirement-evidence
              persistentVolumeClaim: {claimName: {{ .Values.api.cutover.evidencePvc }}}
{{- end }}
{{- end }}
