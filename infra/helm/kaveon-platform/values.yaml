# Private-cloud AKS release. Every image must be pinned by immutable digest at install time.
namespace: kaveon
images:
  api: {repository: "", digest: ""}
  studio: {repository: "", digest: ""}
secrets:
  # Existing secret; this chart never creates or populates it.
  portalAuth: kaveon-portal-auth
# How a person reaches this installation. Studio is the only service
# published: the API stays cluster-internal behind the NetworkPolicy, so every
# request arrives through Studio's proxy, which is what stamps the identity the
# API trusts.
#
# Disabled by default. An installation chooses its own ingress controller and
# certificate source, and a chart that published a service by default would be
# deciding that for them.
# Studio's own settings.
portal:
  # The address a browser reaches this Studio at. Defaults to the ingress
  # host; set it explicitly when something in front (a CDN, a custom domain)
  # answers on a different name than the ingress does.
  publicUrl: ""
  # Sign in to Microsoft through the browser pop-up flow (a public client)
  # rather than the server-side redirect flow (a confidential client).
  #
  # Leave false when the registration has a client secret: the redirect flow
  # cannot be blocked by a pop-up blocker. Set true only for a registration
  # that has no secret to hold.
  entraPublicClient: false

ingress:
  enabled: false
  # The name people type. Required when enabled.
  host: ""
  # Other names that answer on the same Studio — a `www.` form, a legacy
  # hostname kept alive during a cutover.
  #
  # Every name here joins the certificate, and an ACME HTTP-01 issuer proves
  # each one by being reached at it. So a name that does not resolve to this
  # ingress fails the whole certificate, including the canonical host — the
  # existing certificate keeps serving until it expires, and then the site is
  # down with nothing in the logs but a renewal that has been quietly failing
  # for weeks. Add a name here only once its DNS already points here.
  aliasHosts: []
  # e.g. "webapprouting.kubernetes.azure.com" on AKS managed ingress, or
  # "nginx" for an ingress-nginx install.
  className: ""
  annotations: {}
  tls:
    enabled: false
    # The Secret an issuer writes the certificate into — cert-manager's
    # `cert-manager.io/cluster-issuer` annotation, or one created by hand.
    secretName: ""

engine:
  service: kaveon-coordinator.kaveon.svc.cluster.local
  port: 8080
  caConfigMap: kaveon-engine-ca
  caKey: ca.crt
  # Set this instead of caConfigMap when the private CA is stored as a Secret.
  caSecret: ""
seed:
  catalog: OpenSource
  name: OpenSource
  adls:
    account: ""
    container: opensource
    rootPath: snapshots/2026-09-09-v1
  credentialRef: kaveon-test-reader
api:
  # The demo posture (KAVEON_DEMO_MODE): every mutating platform route is
  # read-only below the Admin role and submitted SQL is confined to read
  # statements. Off for a self-hosted install; pair it with the Engine chart's
  # resourceGroups block, which carries the per-principal live-read quota.
  demoMode: false
  evidenceStorage:
    # Create a restricted, durable PVC shared by report/smoke Jobs and the
    # PostgreSQL-free API. Azure Files CSI supplies the required RWX topology.
    create: false
    name: kaveon-retirement-evidence
    storageClass: azurefile-csi
    size: 1Gi
    accessModes: [ReadWriteMany]
    retain: true
  cutover:
    # Final retirement and first PostgreSQL-free restart rehearsal are mutually
    # exclusive. Runtime validation rejects incomplete evidence or family sets.
    retirementMode: false
    restartRehearsalMode: false
    # Keep the PostgreSQL StatefulSet, Service, and PVC rendered during the
    # non-destructive restart rehearsal.  The PostgreSQL ingress policy is
    # tightened separately so the API cannot use it.
    retainPostgresDuringRestart: false
    authorityFamilies: ""
    readAuthorityFamilies: ""
    evidencePvc: ""
    evidencePath: /retirement/postgresql-reconciliation-evidence.json
    auditPath: /retirement/postgresql-retirement-audit.json
    reportDirectory: /retirement/family-reports
    receiptDirectory: /retirement/receipts
    maxAgeHours: 24
    postgresqlWriteFence: false
    liveDlmArtifactPublish: false
    artifactAccount: ""
    artifactContainer: ""
    shadowReads:
      sources: false
      datasets: false
      charts: false
      dashboards: false
      userThemes: false
      favorites: false
      userRecents: false
      queryHistory: false
      savedQueries: false
      activity: false
      chatHistory: false
      dlmDefinitions: false
    outbox:
      charts: false
      dashboards: false
      savedQueries: false
      queryHistory: false
      activity: false
      chatHistory: false
  productReplay:
    # Enable only after backfill and target credentials are qualified.
    enabled: false
    batchSize: 50
    intervalSeconds: 5
  # Scheduled archive of the Engine's own registry — the catalogs, schemas,
  # tables and statistics that say what exists and where it lives.
  #
  # The product catalog needs no schedule: it commits to object storage on
  # every transaction. The registry is a database on the coordinator's volume,
  # and without this nothing copies it anywhere, so losing that volume leaves
  # every byte of data intact in the lake with nothing able to find it.
  #
  # An unchanged registry writes nothing, so the interval costs reads and not
  # storage. It bounds how much registration can be lost, which is the only
  # reason to make it shorter.
  catalogArchive:
    enabled: true
    # Five minutes, not fifteen: an unchanged registry publishes nothing, so
    # the interval costs about forty reads per run and no storage at all. The
    # only thing it buys is a shorter window of registry change exposed to
    # losing the volume, so there is no reason to make it longer.
    #
    # A schedule is not a transaction. This bounds the loss; it does not
    # eliminate it. See the registry-durability entry in HANDSHAKE.md.
    schedule: "*/5 * * * *"
    # Not the container holding the live catalog — container deletion is the
    # one accident blob soft delete does not cover.
    container: backups
    timeoutSeconds: 600
  systemAuthorityReplay:
    # One-shot operator job; never run this in the API web process.
    enabled: false
    family: ""
    table: ""
    reportPath: /tmp/system-authority-replay.json
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  workloadIdentity:
    clientId: ""
  keyVaultUrl: ""
  dlmRunMigration:
    enabled: false
    artifactAccount: ""
    artifactContainer: ""
    checkpointAccount: ""
    checkpointContainer: ""
    checkpointPrefix: "postgresql-retirement/dlm-runs"
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  retirementReports:
    # Requires a restricted PVC pre-populated by live observation/rebuild jobs.
    # These jobs validate evidence and never manufacture source observations.
    enabled: false
    evidencePvc: ""
    maxAgeHours: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  postgresqlFreeSmoke:
    # Enable only after a verified rehearsal/final API pod is ready. The probe
    # identity must own migrated fixtures in every user-scoped family.
    enabled: false
    baseUrl: http://kaveon-api.kaveon.svc.cluster.local:8080
    # Required for non-cluster HTTPS routes before the proxy secret is sent.
    allowedHosts: ""
    identity: ""
    datasetId: ""
    question: ""
    evidencePvc: ""
    outputFile: receipts/postgresql-free-smoke.json
    useCaCert: false
    caConfigMap: ""
    caSecret: ""
    caKey: ca.crt
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: 250m, memory: 256Mi}
  # Serving a request is cheap; compiling a DLM context is not, and both run in
  # this process. Building the context for a 504-million-row table exceeded a
  # 1 GiB limit and the kernel killed the pod mid-generation, which leaves the
  # dataset with its old context already invalidated — a failure that removes
  # context rather than declining to rebuild it.
  #
  # Raised to hold the largest table in the demo lake with room to spare. The
  # better answer is for generation to run as a job rather than inside the API,
  # so one heavy rebuild cannot take the request path down with it; that is
  # recorded in HANDSHAKE rather than done here.
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 6Gi}
studio:
  # Studio renders server-side and proxies every API call, so half a core is
  # what a page wait is made of on a four-core node that is otherwise idle.
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "2", memory: 3Gi}

