trino:
  image:
    repository: trinodb/trino
    digest: sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
  workers: 3
  serviceAccountName: kaveon-engine
  coordinator:
    nodeSelector:
      kubernetes.azure.com/agentpool: system
    resources:
      requests: {cpu: "500m", memory: 1Gi, ephemeral-storage: 2Gi}
      limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 8Gi}
  worker:
    nodeSelector:
      workload: kaveon-worker
    resources:
      requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
      limits: {cpu: "3", memory: 6Gi, ephemeral-storage: 20Gi}
  storage:
    account: ""
    container: silver
  # A read-only Hive catalog over the same Parquet objects the OpenSource
  # Engine catalog reads, so the product corpus's live SQL can be timed on
  # Trino during a leased window. External tables are declared from
  # infra/aks/opensource-catalog-manifest.json; nothing is written to the lake.
  opensource:
    enabled: false
  # TPC-H generation: Trino's tpch connector (data computed on the fly at
  # the chosen scale factor) beside a Hive catalog that may write external
  # Parquet tables under benchmarks/tpch/ in the same container. Enabled
  # only for the generation Job (infra/aks/tpch-generate-job.yaml); the
  # comparison itself reads the objects through the read-only catalog.
  tpch:
    enabled: false
  # Per-query memory mirrors the Kaveon worker budget on the same nodes:
  # 3 GiB per worker per query (KAVEON_QUERY_MEMORY_LIMIT_BYTES), inside
  # the 6 GiB pod limit both engines' workers get. The worker heap leaves
  # the JVM's 1 GB headroom and the pod's system share.
  memory:
    workerHeap: 5G
    queryPerNode: 3GB
    # The coordinator runs no tasks; its 3G heap only has to satisfy Trino's
    # per-node + headroom check.
    coordinatorQueryPerNode: 1GB
    queryTotal: 9GB
  internalSharedSecretName: kaveon-trino-benchmark-auth
  tlsSecretName: kaveon-trino-benchmark-tls

runner:
  enabled: false
  serviceAccountName: kaveon-engine
  image:
    repository: ""
    digest: ""
  runId: ""
  manifestConfigMap: kaveon-trino-benchmark-manifest
  resultsClaim: kaveon-trino-benchmark-results
  credentialsSecret: kaveon-engine-auth
  tlsSecret: kaveon-engine-tls
  trinoTlsSecret: kaveon-trino-benchmark-tls
  trinoAuthSecret: kaveon-trino-benchmark-auth
  kaveon:
    coordinatorStatefulSet: kaveon-coordinator
    workerStatefulSet: kaveon-worker
    service: kaveon-coordinator
    expectedImageDigest: ""
    workloadIdentityReference: kaveon-test-reader
  policy:
    workerCount: 3
    warmups: 5
    repetitionsPerRound: 5
    rounds: 6
    throughputRepeats: 10
    concurrency: 4
    targetRatio: "1.90"
