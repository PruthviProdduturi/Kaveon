apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaveon-portal-api-ingress
  namespace: kaveon
spec:
  podSelector:
    matchLabels: {app: kaveon-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: kaveon-portal}}
        - podSelector: {matchLabels: {app: kaveon-portal-init}}
      ports:
        - {protocol: TCP, port: 8080}
---
{{- if or (not (or .Values.api.cutover.retirementMode .Values.api.cutover.restartRehearsalMode)) (and .Values.api.cutover.restartRehearsalMode .Values.api.cutover.retainPostgresDuringRestart) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaveon-portal-postgres-ingress
  namespace: kaveon
spec:
  podSelector:
    matchLabels: {app: kaveon-postgres}
  policyTypes: [Ingress]
{{- if and .Values.api.cutover.restartRehearsalMode .Values.api.cutover.retainPostgresDuringRestart }}
  # Preserve the database resources and PVC while denying API ingress. The
  # StatefulSet's local readiness probe remains available.
  ingress: []
{{- else }}
  ingress:
    - from:
        - podSelector: {matchLabels: {app: kaveon-api}}
        - podSelector: {matchLabels: {app: kaveon-portal-init}}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
{{- end }}
