apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaveon-portal-api-ingress
  namespace: kaveon
spec:
  podSelector:
    matchLabels: {app: kaveon-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: kaveon-portal}}
        - podSelector: {matchLabels: {app: kaveon-portal-init}}
      ports:
        - {protocol: TCP, port: 8080}
---
{{- if not (or .Values.api.cutover.retirementMode .Values.api.cutover.restartRehearsalMode) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaveon-portal-postgres-ingress
  namespace: kaveon
spec:
  podSelector:
    matchLabels: {app: kaveon-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: kaveon-api}}
        - podSelector: {matchLabels: {app: kaveon-portal-init}}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
