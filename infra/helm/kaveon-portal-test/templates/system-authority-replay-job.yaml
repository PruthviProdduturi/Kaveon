{{- if .Values.api.systemAuthorityReplay.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kaveon-system-authority-replay
  namespace: {{ .Values.namespace }}
  labels: {app: kaveon-system-authority-replay}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: kaveon-system-authority-replay}
      azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: kaveon-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: replay
          image: {{ include "portal.image" (list .Values.images.api "api") }}
          command: [python, /app/run_system_authority_replay.py]
          args:
            - --report
            - {{ .Values.api.systemAuthorityReplay.reportPath | quote }}
{{- if .Values.api.systemAuthorityReplay.family }}
            - --family
            - {{ .Values.api.systemAuthorityReplay.family | quote }}
{{- end }}
{{- if .Values.api.systemAuthorityReplay.table }}
            - --table
            - {{ .Values.api.systemAuthorityReplay.table | quote }}
{{- end }}
          env:
            - {name: METADATA_DB_TYPE, value: postgresql}
            - {name: METADATA_HOST, value: kaveon-postgres}
            - {name: METADATA_PORT, value: "5432"}
            - {name: METADATA_DATABASE, value: kaveonmeta}
            - {name: METADATA_USER, value: kaveon}
            - {name: METADATA_SSLMODE, value: disable}
            - {name: METADATA_PASSWORD, valueFrom: {secretKeyRef: {name: {{ required "secrets.portalAuth is required" .Values.secrets.portalAuth }}, key: METADATA_PASSWORD}}}
            - {name: KAVEON_ENGINE_URL, value: "https://{{ .Values.engine.service }}:{{ .Values.engine.port }}"}
            - {name: KAVEON_ENGINE_CA_CERT, value: /var/run/kaveon/engine-ca/{{ .Values.engine.caKey }}}
            - {name: KAVEON_ENGINE_BRIDGE_TOKEN, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.portalAuth }}, key: KAVEON_ENGINE_BRIDGE_TOKEN}}}
          volumeMounts:
            - {name: engine-ca, mountPath: /var/run/kaveon/engine-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources:
{{ toYaml .Values.api.systemAuthorityReplay.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: engine-ca
{{- if .Values.engine.caSecret }}
          secret: {secretName: {{ .Values.engine.caSecret }}}
{{- else }}
          configMap: {name: {{ required "engine.caConfigMap is required when engine.caSecret is empty" .Values.engine.caConfigMap }}}
{{- end }}
{{- end }}
