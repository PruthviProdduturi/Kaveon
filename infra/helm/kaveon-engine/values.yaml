# What this deployment calls itself. Reaches KAVEON_ENVIRONMENT and is shown to
# administrators in Studio, so name the deployment, not the chart: `aks` for a
# production cluster, `aks-test` for a qualification one.
environment: aks

image:
  repository: ""
  digest: ""
workloadIdentity:
  clientId: ""
studioUrl: ""
# Where KaveonDB keeps the platform's own records — datasets, charts,
# dashboards, sources, chat, query history, activity. Immutable snapshot
# objects plus a conditional head update, so the store itself is the system of
# record and the coordinator's disk holds nothing that matters.
productTransactions:
  enabled: false
  account: ""
  container: ""
  # The full prefix of the catalog, head object included.
  #
  # This read `kaveon/product-catalog`, one segment short of the catalog it was
  # meant to open. The Engine found no head there, so rather than failing it
  # initialised a fresh genesis head beside the real one — and Studio correctly
  # reported an installation with no datasets while nine of them, thirteen
  # dashboards and eighty-nine charts sat intact at generation 9630 one
  # directory deeper. A prefix that points at nothing is indistinguishable
  # from a new installation, which is exactly why it has to be written out in
  # full and never assembled from parts.
  prefix: kaveon/product-catalog/product-transactions
serviceAccountName: kaveon-engine
serviceAccount:
  create: true
credentialsSecret: kaveon-engine-auth
tlsSecret: kaveon-engine-tls
coordinator:
  replicas: 1
  imageDigest: ""
  credentialsSecret: ""
  nodeSelector:
    kubernetes.azure.com/agentpool: system
  storageClass: managed-csi
  storageSize: 32Gi
  # Sized against the node this actually runs on rather than a default. The
  # pool is 4 vCPU and 14.5 GiB allocatable per node, and the coordinator had
  # a 2 vCPU / 4 GiB ceiling — so most of a machine already paid for sat idle
  # while queries spilled to disk inside the limit.
  #
  # Requests stay modest so the node still schedules the jobs beside it;
  # limits are what let a query use the machine when one is running.
  resources:
    requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
    limits: {cpu: "3", memory: 11Gi, ephemeral-storage: 8Gi}
  # Query memory on the coordinator. It plans, admits and merges final
  # results; workers carry the fragments, so its budgets stay small. The
  # admission limit must not exceed the container memory limit less the
  # Engine's headroom (max(256 MiB, 15 %)); the Engine reads the cgroup limit
  # itself, so KAVEON_PROCESS_MEMORY_LIMIT_BYTES is deliberately not set.
  memory:
    # KAVEON_QUERY_MEMORY_LIMIT_BYTES: 4 GiB per admitted query.
    queryLimitBytes: "4294967296"
    # KAVEON_MEMORY_ADMISSION_LIMIT_BYTES: 8 GiB across admitted queries,
    # inside the 11 GiB container limit less the Engine's headroom of
    # max(256 MiB, 15 %) — 1.65 GiB here.
    admissionLimitBytes: "8589934592"
  # Coordinator-hosted exchange spool (KAVEON_COORDINATOR_EXCHANGE_SPOOL).
  # Off: workers spool exchanges on their own disk (workers.exchange.spool)
  # and the coordinator relays no exchange traffic. The limits stay sized for
  # the 32 GiB state PVC so the spool can be turned back on without retuning.
  exchange:
    spool: false
    # KAVEON_EXCHANGE_DISK_LIMIT_BYTES: 24 GiB across all active exchanges.
    diskLimitBytes: "25769803776"
    # KAVEON_EXCHANGE_QUERY_DISK_LIMIT_BYTES: 16 GiB, one query's share.
    queryDiskLimitBytes: "17179869184"
workers:
  # One worker per node, and the pool is four. Supported range is 1-4: workers
  # self-register with the coordinator through KAVEON_DISCOVERY_URI, so there
  # is no static peer list and no count baked in anywhere. More than four would
  # leave a pod unschedulable, because the chart places one worker per node.
  #
  # Four, not three, so a benchmark round can take three nodes for a node-equal
  # measurement while the platform keeps serving on the fourth. On three nodes
  # those two are mutually exclusive — either the measurement acquires a
  # co-tenant or the platform goes to zero workers, which is what took the demo
  # down for a whole campaign. See BENCH_WORKERS / DEMO_WORKERS / REST_WORKERS
  # in scripts/benchmark-rounds.py.
  replicas: 4
  # Pod components a worker must never share a node with, matched on
  # `app.kubernetes.io/component`. The benchmark runs a second query engine on
  # this cluster for a node-equal comparison, and a Kaveon worker sharing a
  # node with it makes that comparison meaningless — so the separation is
  # declared rather than left to the scheduler, which has no reason to prefer
  # an empty node over a busy one.
  separateFrom:
    - trino-worker
    - trino-coordinator
  nodeSelector:
    workload: kaveon-worker
  # One worker per node, so the node is close to theirs alone. A 6 GiB ceiling
  # on a 14.5 GiB machine meant fragments spilled to disk while memory that
  # was already paid for went unused.
  resources:
    requests: {cpu: "1", memory: 3Gi, ephemeral-storage: 4Gi}
    limits: {cpu: "3200m", memory: 11Gi, ephemeral-storage: 24Gi}
  # Query memory on a worker, inside the 11 GiB container limit less the
  # Engine's headroom. KAVEON_PROCESS_MEMORY_LIMIT_BYTES is not set: the
  # Engine reads its cgroup limit.
  memory:
    # KAVEON_QUERY_MEMORY_LIMIT_BYTES: 6 GiB per query per worker.
    queryLimitBytes: "6442450944"
    # KAVEON_MEMORY_ADMISSION_LIMIT_BYTES: 8 GiB across admitted fragments,
    # inside the 11 GiB container limit less the Engine's headroom.
    admissionLimitBytes: "8589934592"
  # Worker-hosted exchange spool (KAVEON_WORKER_EXCHANGE_SPOOL). On, a worker
  # keeps the exchange partitions addressed to it on its own disk under
  # /state/exchange, so producers upload straight to the consuming worker.
  # Received payloads spool under /state too (KAVEON_IPC_SPOOL_ROOT). Both
  # live on the ephemeral state volume sized by stateSizeLimit.
  exchange:
    spool: true
    # KAVEON_EXCHANGE_DISK_LIMIT_BYTES: 8 GiB across all active exchanges.
    diskLimitBytes: "8589934592"
    # KAVEON_EXCHANGE_QUERY_DISK_LIMIT_BYTES: 6 GiB, one query's share.
    queryDiskLimitBytes: "6442450944"
  # sizeLimit of the /state emptyDir: catalog, exchange spool and received
  # payload spool. Counts toward the container's ephemeral-storage limit,
  # which is sized so a full /state plus a full /tmp (6Gi) still fits.
  stateSizeLimit: 16Gi
# KAVEON_HASH_SPILL_BYTES on every node: hash aggregate and join spill under
# /tmp/spill (KAVEON_HASH_SPILL_ROOT), inside the 6 GiB /tmp emptyDir.
spillDiskLimitBytes: "4294967296"
# The coordinator's resource groups as a Helm-managed document. Off (the
# default) nothing is rendered: the coordinator keeps its durable runtime copy,
# else the built-in `default` group, and Settings -> Governance edits it. On,
# the document below is rendered to a ConfigMap, mounted read-only at
# /etc/kaveon/resource-groups/resource-groups.json and named by
# KAVEON_RESOURCE_GROUPS, which takes precedence over the durable copy; a
# runtime PUT /v1/admin/resource-groups then fails, because the file is
# Helm's. The example is the public demo's posture: `demo.enabled` with a
# `rate` of five live statements per principal per rolling six hours
# (answers from the result cache and from statistics are not counted, admins
# are exempt), everyone but admins in the `demo` group. Pair it with the portal
# chart's `api.demoMode`. Keys and bounds: docs/engine/governance.md.
resourceGroups:
  enabled: false
  document:
    demo:
      enabled: true
    groups:
      - name: demo
        max_concurrent: 2
        max_queued: 8
        max_queue_wait_seconds: 30
        rate: {max_statements: 5, per_seconds: 21600, count: live}
      - name: default
        max_concurrent: 4
    selectors:
      - {role: admin, group: default}
      - {group: demo}
