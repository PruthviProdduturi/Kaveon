apiVersion: batch/v1
kind: Job
metadata: {name: kaveon-product-consolidate-v1, namespace: kaveon}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: kaveon-product-consolidate}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: {workload: kaveon-worker}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: consolidate
        image: kvtestegmf6oweugsno.azurecr.io/kaveon-curate@sha256:7f78a0b30d509278e22a1ee05a95a19e1db9622b148d1e7ad3ba8786d41d1447
        command: [sh, -c]
        args: ["set -eu; python /scripts/consolidate-kaveon-product.py; python /scripts/upload-curated-adls.py; cat /work/kaveon-product-readable-manifest.json"]
        env:
        - {name: ADLS_ACCOUNT, value: kvtestegmf6oweugsno}
        - {name: ADLS_CONTAINER, value: opensource}
        - name: ADLS_UPLOAD_TOKEN
          valueFrom: {secretKeyRef: {name: kaveon-opensource-upload, key: token}}
        resources:
          requests: {cpu: 500m, memory: 4Gi, ephemeral-storage: 8Gi}
          limits: {cpu: "2", memory: 12Gi, ephemeral-storage: 30Gi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: work, mountPath: /work},{name: scripts, mountPath: /scripts, readOnly: true}]
      volumes:
      - name: work
        emptyDir: {sizeLimit: 28Gi}
      - name: scripts
        configMap: {name: kaveon-product-synthetic-scripts}
