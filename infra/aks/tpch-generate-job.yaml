# TPC-H generation: Trino's tpch connector writes the eight tables as Delta
# tables under TPCH_ROOT in the opensource container (Tier 3 of
# docs/qualification/benchmark-program.md). Runs only inside a Trino window
# with the chart upgraded to trino.tpch.enabled=true. Before applying:
#
#   kubectl -n kaveon create configmap kaveon-tpch-generate-input \
#     --from-file=generate-tpch-trino.py=scripts/generate-tpch-trino.py
#
# The manifest is read from the Job log (TPCH_GENERATE=) and kept as
# docs/qualification/tpch/tables.json for both engines' registrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaveon-tpch-generate
  namespace: kaveon
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: kaveon-benchmark
        app.kubernetes.io/component: tpch-generate
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: kaveon-engine
      nodeSelector: {kubernetes.azure.com/agentpool: system}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: runner
          image: kvtesticmwwliihpppo.azurecr.io/kaveon-benchmark-runner@sha256:93fa340eadd1f5654de67defcf76b8e60b2221a33c10257413808a3e1bfdd2a4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          command: [python, /input/generate-tpch-trino.py]
          env:
            - {name: TRINO_URL, value: "https://kaveon-benchmark-trino.kaveon.svc.cluster.local:8443"}
            - {name: TRINO_ACCOUNT, value: kvtesticmwwliihpppo}
            - {name: TPCH_SCALE, value: "100"}
            # Delta tables (see scripts/generate-tpch-trino.py); the plain
            # Parquet layout from the first generation stays under
            # benchmarks/tpch/sf100/ until it is removed.
            - {name: TPCH_ROOT, value: benchmarks/tpch/delta/sf100}
            - {name: TPCH_OUTPUT, value: /results/tpch-tables.json}
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
            limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}
          volumeMounts:
            - {name: input, mountPath: /input, readOnly: true}
            - {name: trino-tls, mountPath: /trino-tls, readOnly: true}
            - {name: trino-auth, mountPath: /trino-auth, readOnly: true}
            - {name: results, mountPath: /results}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: input
          configMap: {name: kaveon-tpch-generate-input}
        - name: trino-tls
          secret: {secretName: kaveon-trino-benchmark-tls}
        - name: trino-auth
          secret: {secretName: kaveon-trino-benchmark-auth}
        # The record is read from the Job log; nothing here needs to outlive
        # the pod, and the runner's results claim exists only while the
        # runner is enabled.
        - {name: results, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
