[workspace]
members = [
    "crates/core",
    "crates/storage",
    "crates/exec",
    "crates/sql",
    "crates/optim",
    "crates/python",
    "crates/cli",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PruthviProdduturi/Kaveon"

[workspace.dependencies]
arrow = { version = "54", features = ["ffi"] }
parquet = { version = "54", features = ["arrow", "snap", "zstd"] }
sqlparser = "0.53"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
